<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - Admin</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="icon" href="imgs/logo1.png" type="image/png" />


</head>
<body>

    <div class="admin-wrapper">

        <header class="admin-header">
            <h1>👥 Student Management</h1>
            <div class="links">
                <a href="admin.html">← Dashboard</a>
                <a href="index.html">Website</a>
                <button class="btn-logout" onclick="logout()">🚪 Logout</button>
            </div>
        </header>

        <!-- ===== TOAST ===== -->
        <div id="toast" class="toast"></div>

        <!-- ===== TOOLS BAR ===== -->
        <div class="tools-bar">
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search by name, class, email..." oninput="filterStudents()">
            <button class="btn-create" onclick="openCreateModal()">➕ Create Student</button>
        </div>

        <!-- ===== STUDENT TABLE ===== -->
        <div class="table-wrapper">
            <table class="student-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Roll</th>
                        <th>Points</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsBody">
                    <tr>
                        <td colspan="7" class="no-students">Loading students...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- ============================================================ -->
        <!-- ===== CREATE STUDENT MODAL ===== -->
        <!-- ============================================================ -->
        <div class="modal-overlay" id="createModal">
            <div class="modal-box">
                <button class="close-btn" onclick="closeCreateModal()">✕</button>
                <h2>➕ Create Student Account</h2>
                <div id="createMessage" class="toast"></div>
                <form id="createForm" onsubmit="createStudent(event)">
                    <label for="createName">Full Name *</label>
                    <input type="text" id="createName" placeholder="e.g., Priya Singh" required>

                    <label for="createClass">Class *</label>
                    <select id="createClass" required>
                        <option value="8-A">8-A</option>
                        <option value="8-B">8-B</option>
                        <option value="9-A">9-A</option>
                        <option value="9-B">9-B</option>
                        <option value="10-A">10-A</option>
                        <option value="10-B">10-B</option>
                        <option value="11-A">11-A</option>
                        <option value="11-B">11-B</option>
                        <option value="12-A">12-A</option>
                        <option value="12-B">12-B</option>
                    </select>

                    <label for="createRoll">Roll Number *</label>
                    <input type="number" id="createRoll" placeholder="e.g., 15" min="1" max="50" required>

                    <label for="createEmail">Email *</label>
                    <input type="email" id="createEmail" placeholder="student@email.com" required>

                    <label for="createPassword">Password *</label>
                    <input type="text" id="createPassword" placeholder="Min 6 characters" minlength="6" required>

                    <div class="btn-row">
                        <button type="submit" class="btn-primary" id="createBtn">➕ Create Account</button>
                        <button type="button" class="btn-cancel" onclick="closeCreateModal()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- ===== FIREBASE SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyAHmBCyGlSo1puz1LZ7k-4twg_XAcOqyRA",
            authDomain: "svgms-backend.firebaseapp.com",
            projectId: "svgms-backend",
            storageBucket: "svgms-backend.firebasestorage.app",
            messagingSenderId: "1065359559935",
            appId: "1:1065359559935:web:977cea73a68e05813750ca"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== DOM REFS =====
        const studentsBody = document.getElementById('studentsBody');
        const toast = document.getElementById('toast');
        const searchInput = document.getElementById('searchInput');

        let allStudents = [];

        // ===== CHECK ADMIN =====
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'admin.html';
                return;
            }
            // Check if user is admin (optional)
            loadStudents();
        });

        // ============================================================
        // LOAD STUDENTS
        // ============================================================
        async function loadStudents() {
            studentsBody.innerHTML = '<tr><td colspan="7" class="no-students">Loading students...</td></tr>';

            try {
                const snapshot = await db.collection('students')
                    .orderBy('name')
                    .get();

                allStudents = [];
                snapshot.forEach(doc => {
                    allStudents.push({ id: doc.id, ...doc.data() });
                });

                renderStudents(allStudents);

            } catch (error) {
                console.error('Error loading students:', error);
                studentsBody.innerHTML = '<tr><td colspan="7" class="no-students">❌ Error loading students</td></tr>';
            }
        }

        // ============================================================
        // RENDER STUDENTS
        // ============================================================
        function renderStudents(students) {
            if (students.length === 0) {
                studentsBody.innerHTML = '<tr><td colspan="7" class="no-students">No students found.</td></tr>';
                return;
            }

            studentsBody.innerHTML = '';
            students.forEach((student, index) => {
                const isBanned = student.isBanned === true;
                const statusHtml = isBanned
                    ? '<span class="status-badge banned">🔴 Banned</span>'
                    : '<span class="status-badge active">🟢 Active</span>';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${student.name || 'N/A'}</strong></td>
                    <td>${student.class || '--'}</td>
                    <td>${student.rollNo || '--'}</td>
                    <td>${student.totalPoints || 0}</td>
                    <td>${statusHtml}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-view" onclick="viewActivity('${student.id}')">📊</button>
                            ${isBanned
                                ? `<button class="btn-unban" onclick="toggleBan('${student.id}', false)">✅ Unban</button>`
                                : `<button class="btn-ban" onclick="toggleBan('${student.id}', true)">⛔ Ban</button>`
                            }
                            <button class="btn-delete" onclick="deleteStudent('${student.id}')">🗑️</button>
                        </div>
                    </td>
                `;
                studentsBody.appendChild(row);
            });
        }

        // ============================================================
        // FILTER STUDENTS
        // ============================================================
        function filterStudents() {
            const query = searchInput.value.toLowerCase().trim();
            if (!query) {
                renderStudents(allStudents);
                return;
            }

            const filtered = allStudents.filter(s =>
                (s.name && s.name.toLowerCase().includes(query)) ||
                (s.class && s.class.toLowerCase().includes(query)) ||
                (s.email && s.email.toLowerCase().includes(query))
            );
            renderStudents(filtered);
        }

        // ============================================================
        // CREATE STUDENT
        // ============================================================
        async function createStudent(event) {
            event.preventDefault();

            const name = document.getElementById('createName').value.trim();
            const classValue = document.getElementById('createClass').value;
            const rollNo = parseInt(document.getElementById('createRoll').value);
            const email = document.getElementById('createEmail').value.trim();
            const password = document.getElementById('createPassword').value;
            const message = document.getElementById('createMessage');
            const btn = document.getElementById('createBtn');

            if (!name || !email || !password) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating...';
            message.className = 'toast loading';
            message.textContent = 'Creating account...';

            try {
                // 1. Create Auth Account
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // 2. Save to Firestore
                await db.collection('students').doc(user.uid).set({
                    uid: user.uid,
                    name: name,
                    class: classValue,
                    rollNo: rollNo,
                    email: email,
                    totalPoints: 0,
                    streak: 0,
                    isBanned: false,
                    joinedDate: new Date().toISOString(),
                    achievements: []
                });

                message.className = 'toast success';
                message.textContent = '✅ Student created successfully!';
                btn.textContent = '✅ Done!';

                setTimeout(() => {
                    closeCreateModal();
                    loadStudents();
                }, 1500);

            } catch (error) {
                console.error('Create student error:', error);
                message.className = 'toast error';
                message.textContent = '❌ ' + error.message;
                btn.disabled = false;
                btn.textContent = '➕ Create Account';
            }
        }

        // ============================================================
        // TOGGLE BAN
        // ============================================================
                // ============================================================
        // TOGGLE BAN
        // ============================================================
        async function toggleBan(studentId, ban) {
            const action = ban ? 'ban' : 'unban';
            if (!confirm(`Are you sure you want to ${action} this student?`)) return;

            try {
                await db.collection('students').doc(studentId).update({
                    isBanned: ban,
                    bannedReason: ban ? 'Banned by admin' : '',
                    bannedAt: ban ? new Date().toISOString() : null
                });

                showToast(`✅ Student ${ban ? 'banned' : 'unbanned'} successfully!`, 'success');
                loadStudents();

            } catch (error) {
                console.error('Toggle ban error:', error);
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        // ============================================================
        // DELETE STUDENT
        // ============================================================
        async function deleteStudent(studentId) {
            if (!confirm('⚠️ Delete this student permanently? This cannot be undone!')) return;

            try {
                // Delete from Firestore
                await db.collection('students').doc(studentId).delete();

                showToast('🗑️ Student deleted successfully!', 'success');
                loadStudents();

            } catch (error) {
                console.error('Delete student error:', error);
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        // ============================================================
        // VIEW ACTIVITY
        // ============================================================
        function viewActivity(studentId) {
            window.location.href = 'admin-activity-log.html?student=' + studentId;
        }

        // ============================================================
        // MODAL CONTROLS
        // ============================================================
        function openCreateModal() {
            const modal = document.getElementById('createModal');
            if (modal) modal.classList.add('active');
            
            const form = document.getElementById('createForm');
            if (form) form.reset();
            
            const message = document.getElementById('createMessage');
            if (message) {
                message.className = 'toast';
                message.textContent = '';
            }
            
            const btn = document.getElementById('createBtn');
            if (btn) {
                btn.disabled = false;
                btn.textContent = '➕ Create Account';
            }
        }

        function closeCreateModal() {
            const modal = document.getElementById('createModal');
            if (modal) modal.classList.remove('active');
        }

        // ============================================================
        // TOAST (FIXED VISIBILITY BUG)
        // ============================================================
        function showToast(message, type) {
            if (!toast) return;
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.style.display = 'block'; // Ensure toast is visible when called
            
            setTimeout(() => { 
                toast.style.display = 'none'; 
            }, 4000);
        }

        // ============================================================
        // LOGOUT
        // ============================================================
        function logout() {
            auth.signOut().then(() => {
                window.location.href = 'admin.html';
            }).catch(err => {
                console.error('Logout error:', err);
            });
        }

        // ============================================================
        // CLOSE MODAL ON CLICK OUTSIDE
        // ============================================================
        const createModalEl = document.getElementById('createModal');
        if (createModalEl) {
            createModalEl.addEventListener('click', function(e) {
                if (e.target === this) {
                    closeCreateModal();
                }
            });
        }
    </script>
</body>
</html>
