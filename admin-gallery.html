<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #1a1a2e;
            font-size: 24px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #4361ee;
            color: white;
        }
        .btn-primary:hover {
            background: #3a56d4;
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }
        .btn-success:hover {
            background: #27ae60;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }
        .btn-warning:hover {
            background: #d68910;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #2d3436;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #4361ee;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .message {
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .message.loading {
            display: block;
            background: #e2e3e5;
            color: #383d41;
            border-left: 4px solid #6c757d;
        }

        .progress-container {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            margin: 15px 0;
            overflow: hidden;
            display: none;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4361ee, #2ecc71);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 15px;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            font-weight: 600;
            color: #2d3436;
        }

        .event-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid #4361ee;
            flex-wrap: wrap;
            gap: 12px;
        }

        .event-info {
            flex: 1;
            min-width: 200px;
        }

        .event-title {
            font-weight: 600;
            color: #1a1a2e;
            font-size: 16px;
        }

        .event-meta {
            font-size: 13px;
            color: #636e72;
            margin-top: 4px;
        }

        .event-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .event-actions .btn {
            padding: 6px 14px;
            font-size: 13px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .image-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e9ecef;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .image-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .image-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .image-card .image-error {
            width: 100%;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            color: #e74c3c;
            font-size: 13px;
        }

        .image-card .image-error span {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .image-card .image-caption {
            padding: 8px 12px;
            font-size: 13px;
            color: #2d3436;
            background: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .image-card .delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            z-index: 10;
        }

        .image-card .delete-btn:hover {
            background: #c0392b;
            transform: scale(1.1);
        }

        .delete-cloud-btn {
            width: calc(100% - 12px);
            margin: 0 6px 6px;
            padding: 6px 8px;
            border: 1px solid #d29b35;
            border-radius: 4px;
            background: #fff8e8;
            color: #7a5512;
            cursor: pointer;
            font-size: 11px;
        }

        .delete-cloud-btn:hover:not(:disabled) {
            background: #f6ead0;
        }

        .delete-cloud-btn:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .hidden {
            display: none !important;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #636e72;
        }

        .empty-state span {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .header-actions {
                justify-content: center;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .event-item {
                flex-direction: column;
                text-align: center;
            }

            .event-actions {
                justify-content: center;
            }

            .image-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header">
        <h1>🖼️ Gallery Manager</h1>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="goToDashboard()">← Dashboard</button>
            <button class="btn btn-secondary" onclick="goToSite()">View Site</button>
            <button class="btn btn-warning" onclick="cleanupBrokenImages()">🧹 Clean Broken</button>
            <button class="btn btn-danger" onclick="logout()">🚪 Logout</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📅 Create New Event</div>
        <div id="eventMessage" class="message"></div>
        <div class="form-row">
            <div class="form-group">
                <label>Event Title *</label>
                <input type="text" id="eventTitle" class="form-control" placeholder="e.g., Sports Day 2026">
            </div>
            <div class="form-group">
                <label>Event Date</label>
                <input type="date" id="eventDate" class="form-control">
            </div>
        </div>
        <div class="form-group">
            <label>Description</label>
            <input type="text" id="eventDescription" class="form-control" placeholder="Brief description (optional)">
        </div>
        <button class="btn btn-success" id="createEventBtn" onclick="createGalleryEvent()" disabled>➕ Create Event</button>
    </div>

    <div class="card hidden" id="uploadSection">
        <div class="card-title">📤 Upload Images to <span id="selectedEventTitle"></span></div>
        <div id="uploadMessage" class="message"></div>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
        <div class="form-group">
            <label>Choose Images</label>
            <input type="file" id="imageFiles" class="form-control" accept="image/*" multiple>
            <small style="color: #636e72; display: block; margin-top: 5px;">
                Max 5MB per image. Supports JPG, PNG, GIF, WebP.
            </small>
        </div>
        <div class="form-group">
            <label>Caption (optional)</label>
            <input type="text" id="imageCaption" class="form-control" placeholder="Caption for all images">
        </div>
        <input type="hidden" id="selectedEventId">
        <button class="btn btn-primary" onclick="uploadImages()">📤 Upload Images</button>
        <button class="btn btn-secondary" onclick="cancelUpload()">Cancel</button>
    </div>

    <div class="card">
        <div class="card-title">📋 Events</div>
        <div id="eventsList">
            <div class="empty-state">
                <span>⏳</span>
                Loading events...
            </div>
        </div>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
// ==========================================
// CONFIGURATION
// ==========================================
const CONFIG = {
    firebase: {
        apiKey: "AIzaSyAHmBCyGlSo1puz1LZ7k-4twg_XAcOqyRA",
        authDomain: "svgms-backend.firebaseapp.com",
        projectId: "svgms-backend",
        storageBucket: "svgms-backend.firebasestorage.app",
        messagingSenderId: "1065359559935",
        appId: "1:1065359559935:web:977cea73a68e05813750ca"
    },
    cloudinary: {
        cloudName: "zh3vg8mi",
        uploadPreset: "school_notices"
    }
};

// ==========================================
// INITIALIZATION
// ==========================================
firebase.initializeApp(CONFIG.firebase);
const auth = firebase.auth();
const db = firebase.firestore();

let currentEventId = null;
const imageCache = {};
let galleryUser = null;
let galleryAuthorized = false;

// ==========================================
// AUTH CHECK
// ==========================================
auth.onAuthStateChanged(async function(user) {
    if (!user) {
        window.location.href = 'admin.html';
        return;
    }

    galleryUser = user;
    try {
        var userDoc = await db.collection('users').doc(user.uid).get();
        var role = userDoc.exists ? userDoc.data().role : null;
        galleryAuthorized = role === 'admin' || role === 'staff';
        if (!galleryAuthorized) {
            showMessage('eventMessage', 'Your account is not authorized to manage the gallery.', 'error');
            return;
        }
        document.getElementById('createEventBtn').disabled = false;
        loadEvents();
    } catch (error) {
        console.error('Gallery authorization error:', error);
        showMessage('eventMessage', 'Could not verify gallery permissions. Please sign in again.', 'error');
    }
});

// ==========================================
// NAVIGATION
// ==========================================
function goToDashboard() {
    window.location.href = 'admin.html';
}

function goToSite() {
    window.location.href = 'index.html';
}

// ==========================================
// CREATE EVENT
// ==========================================
function createGalleryEvent() {
    if (!galleryUser || !galleryAuthorized) {
        showMessage('eventMessage', 'You are not authorized to create gallery events.', 'error');
        return;
    }

    var title = document.getElementById('eventTitle').value.trim();
    var date = document.getElementById('eventDate').value;
    var description = document.getElementById('eventDescription').value.trim();

    if (!title) {
        showMessage('eventMessage', 'Please enter an event title.', 'error');
        return;
    }

    var createButton = document.getElementById('createEventBtn');
    createButton.disabled = true;
    showMessage('eventMessage', 'Creating event...', 'loading');

    db.collection('events').add({
        title: title,
        date: date || null,
        description: description || '',
        createdBy: galleryUser.uid,
        createdByEmail: galleryUser.email || '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
        showMessage('eventMessage', '✅ Event created successfully!', 'success');
        document.getElementById('eventTitle').value = '';
        document.getElementById('eventDate').value = '';
        document.getElementById('eventDescription').value = '';
        loadEvents();
    }).catch(function(error) {
        console.error('Error:', error);
        var message = error.code === 'permission-denied'
            ? '❌ Firestore denied this action. Confirm your account has the admin/staff role and the Firestore rules allow event creation.'
            : '❌ Could not create event: ' + error.message;
        showMessage('eventMessage', message, 'error');
    }).finally(function() {
        createButton.disabled = false;
    });
}

window.createGalleryEvent = createGalleryEvent;

// ==========================================
// LOAD EVENTS
// ==========================================
function loadEvents() {
    var container = document.getElementById('eventsList');
    container.innerHTML = '<div class="empty-state"><span>⏳</span>Loading events...</div>';

    db.collection('events').orderBy('date', 'desc').get().then(function(snapshot) {
        if (snapshot.empty) {
            container.innerHTML = '<div class="empty-state"><span>📭</span>No events created yet.</div>';
            return;
        }

        container.innerHTML = '';
        var promises = [];

        snapshot.forEach(function(doc) {
            var event = doc.data();
            var eventId = doc.id;

            var promise = db.collection('eventImages')
                .where('eventId', '==', eventId)
                .get()
                .then(function(imgSnapshot) {
                    var images = [];
                    imgSnapshot.forEach(function(imgDoc) {
                        images.push({ id: imgDoc.id, data: imgDoc.data() });
                    });

                    var div = document.createElement('div');
                    div.className = 'event-item';
                    
                    var title = escapeHtml(event.title);
                    var desc = event.description ? escapeHtml(event.description) : '';
                    var dateStr = event.date ? formatDate(event.date) : '';
                    
                    div.innerHTML = 
                        '<div class="event-info">' +
                            '<div class="event-title">' + title + '</div>' +
                            '<div class="event-meta">' +
                                (dateStr ? '📅 ' + dateStr : '') +
                                (desc ? '| ' + desc : '') +
                                '| 🖼️ ' + images.length + ' images' +
                            '</div>' +
                        '</div>' +
                        '<div class="event-actions">' +
                            '<button class="btn btn-primary" data-eventid="' + eventId + '" data-eventtitle="' + title.replace(/"/g, '&quot;') + '" onclick="showUpload(this)">📤 Add</button>' +
                            '<button class="btn btn-warning" data-eventid="' + eventId + '" onclick="toggleManage(this)">🖼️ Manage</button>' +
                            '<button class="btn btn-danger" data-eventid="' + eventId + '" onclick="deleteEvent(this)">🗑️ Delete</button>' +
                        '</div>' +
                        '<div id="manage-' + eventId + '" style="width:100%; display:none; margin-top:15px;">' +
                            '<div id="images-' + eventId + '" class="image-grid">' +
                                (images.length === 0 ? '<p style="grid-column:1/-1; color:#636e72; text-align:center;">No images in this event.</p>' : '') +
                            '</div>' +
                        '</div>';

                    container.appendChild(div);

                    if (images.length > 0) {
                        var grid = document.getElementById('images-' + eventId);
                        var imgPromises = images.map(function(img) {
                            return checkImage(img.data.imageUrl).then(function(exists) {
                                var card = createImageCard(img.id, img.data, eventId, exists);
                                grid.appendChild(card);
                            });
                        });
                        return Promise.all(imgPromises);
                    }
                });

            promises.push(promise);
        });

        return Promise.all(promises);
    }).catch(function(error) {
        console.error('Error:', error);
        container.innerHTML = '<div class="empty-state"><span>❌</span>Error loading events</div>';
    });
}

// ==========================================
// TOGGLE MANAGE
// ==========================================
function toggleManage(button) {
    var eventId = button.getAttribute('data-eventid');
    var container = document.getElementById('manage-' + eventId);
    if (!container) return;

    if (container.style.display === 'none') {
        container.style.display = 'block';
        refreshImages(eventId);
    } else {
        container.style.display = 'none';
    }
}

// ==========================================
// REFRESH IMAGES
// ==========================================
function refreshImages(eventId) {
    var grid = document.getElementById('images-' + eventId);
    if (!grid) return;

    grid.innerHTML = '<p style="grid-column:1/-1; color:#636e72; text-align:center;">Loading images...</p>';

    db.collection('eventImages')
        .where('eventId', '==', eventId)
        .get()
        .then(function(snapshot) {
            if (snapshot.empty) {
                grid.innerHTML = '<p style="grid-column:1/-1; color:#636e72; text-align:center;">No images in this event.</p>';
                return;
            }

            grid.innerHTML = '';
            var promises = [];

            snapshot.forEach(function(doc) {
                var img = doc.data();
                var imgId = doc.id;
                var promise = checkImage(img.imageUrl).then(function(exists) {
                    var card = createImageCard(imgId, img, eventId, exists);
                    grid.appendChild(card);
                });
                promises.push(promise);
            });

            return Promise.all(promises);
        })
        .catch(function(error) {
            console.error('Error:', error);
            grid.innerHTML = '<p style="grid-column:1/-1; color:#dc3545; text-align:center;">Error loading images.</p>';
        });
}

// ==========================================
// CHECK IMAGE
// ==========================================
function checkImage(url) {
    return new Promise(function(resolve) {
        if (!url || !url.startsWith('http')) {
            resolve(false);
            return;
        }

        if (imageCache[url] !== undefined) {
            resolve(imageCache[url]);
            return;
        }

        var img = new Image();
        var resolved = false;

        var timeout = setTimeout(function() {
            if (!resolved) {
                resolved = true;
                imageCache[url] = false;
                resolve(false);
            }
        }, 3000);

        img.onload = function() {
            if (!resolved) {
                resolved = true;
                clearTimeout(timeout);
                imageCache[url] = true;
                resolve(true);
            }
        };

        img.onerror = function() {
            if (!resolved) {
                resolved = true;
                clearTimeout(timeout);
                imageCache[url] = false;
                resolve(false);
            }
        };

        img.src = url;
    });
}

// ==========================================
// CREATE IMAGE CARD
// ==========================================
function createImageCard(id, img, eventId, exists) {
    var card = document.createElement('div');
    card.className = 'image-card';

    var caption = img.caption || 'Untitled';
    var url = img.imageUrl || '';
    var publicId = encodeURIComponent(img.publicId || '');
    var cloudDeleteButton = publicId
        ? '<button class="delete-cloud-btn" data-imageid="' + id + '" data-eventid="' + eventId + '" data-publicid="' + publicId + '" onclick="deleteImageFromCloud(this)">☁ Delete Cloud + DB</button>'
        : '<button class="delete-cloud-btn" disabled title="This older upload has no Cloudinary public ID">☁ Cloud ID unavailable</button>';
    var actions = '<button class="delete-btn" data-imageid="' + id + '" data-eventid="' + eventId + '" onclick="deleteImage(this)">× Delete DB record</button>' + cloudDeleteButton;

    if (exists && url) {
        card.innerHTML = 
            '<img src="' + url + '" alt="' + escapeHtml(caption) + '" loading="lazy">' +
            '<div class="image-caption">' + escapeHtml(caption) + '</div>' +
            actions;
    } else {
        card.innerHTML = 
            '<div class="image-error">' +
                '<span>🖼️</span>' +
                'Image not found' +
            '</div>' +
            '<div class="image-caption">' + escapeHtml(caption) + '</div>' +
            actions;
    }

    return card;
}

// ==========================================
// DELETE IMAGE
// ==========================================
function deleteImage(button) {
    var imageId = button.getAttribute('data-imageid');
    var eventId = button.getAttribute('data-eventid');
    
    if (!confirm('Delete this image?')) return;

    db.collection('eventImages').doc(imageId).delete()
        .then(function() {
            showMessage('eventMessage', '✅ Image deleted!', 'success');
            refreshImages(eventId);
            loadEvents();
        })
        .catch(function(error) {
            showMessage('eventMessage', '❌ Error: ' + error.message, 'error');
        });
}

async function deleteImageFromCloud(button) {
    var imageId = button.getAttribute('data-imageid');
    var eventId = button.getAttribute('data-eventid');
    var publicId = decodeURIComponent(button.getAttribute('data-publicid') || '');
    if (!publicId) return;
    if (!confirm('Delete this image from Cloudinary and remove its database record?')) return;

    button.disabled = true;
    try {
        var token = await auth.currentUser.getIdToken();
        var response = await fetch('/api/delete-cloudinary-image', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ publicId: publicId, resourceType: 'image', type: 'upload' })
        });
        var result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Cloudinary deletion failed');
        await db.collection('eventImages').doc(imageId).delete();
        showMessage('eventMessage', '✅ Image deleted from Cloudinary and database.', 'success');
        refreshImages(eventId);
        loadEvents();
    } catch (error) {
        button.disabled = false;
        showMessage('eventMessage', '❌ ' + error.message, 'error');
    }
}

// ==========================================
// DELETE EVENT
// ==========================================
function deleteEvent(button) {
    var eventId = button.getAttribute('data-eventid');
    
    if (!confirm('Delete this event and all its images?')) return;

    db.collection('eventImages')
        .where('eventId', '==', eventId)
        .get()
        .then(function(snapshot) {
            var batch = db.batch();
            snapshot.forEach(function(doc) {
                batch.delete(doc.ref);
            });
            return batch.commit();
        })
        .then(function() {
            return db.collection('events').doc(eventId).delete();
        })
        .then(function() {
            showMessage('eventMessage', '✅ Event deleted!', 'success');
            loadEvents();
        })
        .catch(function(error) {
            showMessage('eventMessage', '❌ Error: ' + error.message, 'error');
        });
}

// ==========================================
// SHOW UPLOAD
// ==========================================
function showUpload(button) {
    var eventId = button.getAttribute('data-eventid');
    var eventTitle = button.getAttribute('data-eventtitle');
    
    currentEventId = eventId;
    document.getElementById('selectedEventId').value = eventId;
    document.getElementById('selectedEventTitle').textContent = eventTitle;
    document.getElementById('uploadSection').classList.remove('hidden');
    document.getElementById('uploadSection').scrollIntoView({ behavior: 'smooth' });
}

function cancelUpload() {
    document.getElementById('uploadSection').classList.add('hidden');
    document.getElementById('imageFiles').value = '';
    document.getElementById('imageCaption').value = '';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('progressText').textContent = '0%';
    document.getElementById('progressContainer').style.display = 'none';
    currentEventId = null;
}

// ==========================================
// UPLOAD IMAGES TO CLOUDINARY
// ==========================================
function uploadImages() {
    var files = document.getElementById('imageFiles').files;
    var caption = document.getElementById('imageCaption').value.trim();
    var eventId = document.getElementById('selectedEventId').value;
    var btn = document.querySelector('#uploadSection .btn-primary');

    if (!files.length) {
        showMessage('uploadMessage', 'Please select at least one image.', 'error');
        return;
    }

    if (!eventId) {
        showMessage('uploadMessage', 'No event selected.', 'error');
        return;
    }

    var maxSize = 5 * 1024 * 1024;
    for (var i = 0; i < files.length; i++) {
        if (files[i].size > maxSize) {
            showMessage('uploadMessage', '❌ ' + files[i].name + ' exceeds 5MB limit.', 'error');
            return;
        }
    }

    btn.disabled = true;
    btn.textContent = 'Uploading...';
    document.getElementById('progressContainer').style.display = 'block';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('progressText').textContent = '0%';
    showMessage('uploadMessage', 'Uploading ' + files.length + ' images...', 'loading');

    var uploaded = 0;
    var errors = 0;
    var total = files.length;
    var currentIndex = 0;

    function processNext() {
        if (currentIndex >= total) {
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('progressText').textContent = '100%';

            if (errors === 0) {
                showMessage('uploadMessage', '✅ ' + uploaded + ' images uploaded successfully!', 'success');
            } else {
                showMessage('uploadMessage', '⚠️ ' + uploaded + ' uploaded, ' + errors + ' failed.', 'error');
            }

            document.getElementById('imageFiles').value = '';
            document.getElementById('imageCaption').value = '';
            setTimeout(function() {
                document.getElementById('progressContainer').style.display = 'none';
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('progressText').textContent = '0%';
            }, 3000);

            btn.disabled = false;
            btn.textContent = '📤 Upload Images';
            loadEvents();
            return;
        }

        var file = files[currentIndex];
        var progress = Math.round((currentIndex / total) * 100);
        document.getElementById('progressBar').style.width = progress + '%';
        document.getElementById('progressText').textContent = progress + '%';
        
        showMessage('uploadMessage', 'Processing ' + (currentIndex+1) + '/' + total + ': ' + file.name, 'loading');

        var formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CONFIG.cloudinary.uploadPreset);

        fetch('https://api.cloudinary.com/v1_1/' + CONFIG.cloudinary.cloudName + '/upload', {
            method: 'POST',
            body: formData
        })
        .then(function(response) {
            return response.json();
        })
        .then(function(data) {
            if (data.secure_url) {
                return db.collection('eventImages').add({
                    eventId: eventId,
                    imageUrl: data.secure_url,
                    publicId: data.public_id || '',
                    caption: caption || '',
                    order: Date.now() + currentIndex,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(function() {
                    uploaded++;
                });
            } else {
                errors++;
                console.error('Upload failed:', data);
                return Promise.resolve();
            }
        })
        .catch(function(error) {
            console.error('Upload error:', error);
            errors++;
            return Promise.resolve();
        })
        .finally(function() {
            currentIndex++;
            var newProgress = Math.round((currentIndex / total) * 100);
            document.getElementById('progressBar').style.width = newProgress + '%';
            document.getElementById('progressText').textContent = newProgress + '%';
            processNext();
        });
    }

    processNext();
}

// ==========================================
// CLEANUP BROKEN IMAGES
// ==========================================
function cleanupBrokenImages() {
    if (!confirm('This will check all images and delete broken ones. Continue?')) return;

    showMessage('eventMessage', '🔍 Scanning images...', 'loading');

    db.collection('eventImages').get().then(function(snapshot) {
        var total = snapshot.size;

        if (total === 0) {
            showMessage('eventMessage', 'No images to check.', 'success');
            return;
        }

        var deleted = 0;
        var checked = 0;
        var promises = [];

        snapshot.forEach(function(doc) {
            var data = doc.data();
            if (data.imageUrl) {
                var promise = checkImage(data.imageUrl).then(function(exists) {
                    checked++;
                    if (!exists) {
                        return db.collection('eventImages').doc(doc.id).delete().then(function() {
                            deleted++;
                        });
                    }
                });
                promises.push(promise);
            }
        });

        return Promise.all(promises).then(function() {
            Object.keys(imageCache).forEach(function(key) {
                delete imageCache[key];
            });
            showMessage('eventMessage', '✅ Checked ' + checked + ' images, deleted ' + deleted + ' broken.', 'success');
            loadEvents();
        });
    }).catch(function(error) {
        console.error('Error:', error);
        showMessage('eventMessage', '❌ Error: ' + error.message, 'error');
    });
}

// ==========================================
// HELPERS
// ==========================================
function showMessage(elementId, text, type) {
    var el = document.getElementById(elementId);
    if (!el) return;
    el.textContent = text;
    el.className = 'message ' + type;
    
    if (type === 'success' || type === 'error') {
        setTimeout(function() {
            el.className = 'message';
        }, 5000);
    }
}

function escapeHtml(text) {
    if (!text) return '';
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function formatDate(dateStr) {
    try {
        return new Date(dateStr).toLocaleDateString('en-IN', {
            day: '2-digit',
            month: 'short',
            year: 'numeric'
        });
    } catch {
        return dateStr;
    }
}

function logout() {
    auth.signOut();
    window.location.href = 'admin.html';
}
