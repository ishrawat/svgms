<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery Manager — SVGMS Admin</title>
<link rel="icon" href="imgs/logo1.png" type="image/png">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ==========================================================================
   GALLERY MANAGER — standalone admin page
   ========================================================================== */
:root {
    --ink:            #1a2b3c;
    --ink-soft:       #2c3e50;
    --ink-deep:       #0d1a26;
    --ochre:          #c8862c;
    --ochre-bright:   #e0a347;
    --ochre-soft:     #f3e4c4;
    --terracotta:     #a84b2f;
    --sage:           #7d8f72;

    --cream:          #faf6ee;
    --cream-deep:     #f2e9d7;
    --paper:          #ffffff;

    --text:           #3a4a56;
    --text-faint:     #738290;

    --line:           rgba(26, 43, 60, 0.12);
    --line-strong:    rgba(26, 43, 60, 0.22);

    --danger:         #a02c2c;
    --danger-soft:    #fce4e4;
    --success:        #1b7f4b;
    --success-soft:   #dff5e6;
    --warning:        #8a5a10;
    --warning-soft:   #fbf1dc;

    --shadow-sm:      0 1px 2px rgba(26, 43, 60, 0.06);
    --shadow:         0 8px 28px rgba(26, 43, 60, 0.08);
    --shadow-lg:      0 22px 55px rgba(26, 43, 60, 0.14);

    --r-sm:           3px;
    --r:              5px;
    --r-lg:           10px;

    --ease:           cubic-bezier(0.4, 0, 0.2, 1);
    --t:              0.25s;

    --font-display:   'Fraunces', Georgia, serif;
    --font-ui:        'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    background:
        radial-gradient(ellipse 1000px 500px at 90% -100px, rgba(200, 134, 44, 0.08), transparent 60%),
        linear-gradient(180deg, #fafbfa, var(--cream));
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; max-width: 100%; height: auto; }
a { color: inherit; text-decoration: none; }

:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }

/* ---------- Layout ---------- */
.admin-wrapper {
    max-width: 1200px;
    margin: 0 auto;
    padding: clamp(1.25rem, 3vw, 2rem);
}

/* ---------- Header ---------- */
.admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1.25rem;
    flex-wrap: wrap;
    padding: 1.15rem 1.4rem;
    background: var(--paper);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    border-bottom: 3px solid var(--ochre);
    margin-bottom: 1.5rem;
}

.admin-header h1 {
    font-family: var(--font-display);
    font-variation-settings: 'SOFT' 30, 'WONK' 1;
    font-weight: 600;
    font-size: 1.35rem;
    color: var(--ink);
    letter-spacing: -0.01em;
    line-height: 1.2;
    display: flex;
    align-items: center;
    gap: 0.6rem;
}

.admin-header h1 i { color: var(--ochre); font-size: 1.1rem; }

.admin-header .links {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.admin-header .links a,
.admin-header .links button {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 1rem;
    border-radius: var(--r-sm);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    border: 1px solid var(--line-strong);
    background: transparent;
    transition: all var(--t) var(--ease);
}

.admin-header .links a:hover,
.admin-header .links button:hover {
    background: var(--cream);
    border-color: var(--ochre);
}

.admin-header .links i { font-size: 0.75rem; color: var(--ochre); }

.btn-logout {
    background: var(--terracotta) !important;
    color: var(--cream) !important;
    border-color: var(--terracotta) !important;
    font-weight: 700;
}

.btn-logout:hover {
    background: #8b3d24 !important;
    border-color: #8b3d24 !important;
    transform: translateY(-1px);
}

.btn-logout i { color: var(--cream) !important; }

/* ---------- Cards ---------- */
.card {
    background: var(--paper);
    padding: clamp(1.4rem, 3vw, 2rem);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    margin-bottom: 1.5rem;
}

.card-title {
    font-family: var(--font-display);
    font-variation-settings: 'SOFT' 30, 'WONK' 1;
    font-weight: 600;
    font-size: 1.15rem;
    color: var(--ink);
    letter-spacing: -0.005em;
    margin-bottom: 1.25rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 0.55rem;
}

.card-title i { color: var(--ochre); font-size: 1rem; }

.card-title .event-name {
    color: var(--terracotta);
    font-style: italic;
    margin-left: 0.15rem;
}

/* ---------- Form ---------- */
.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}

.form-group { margin-bottom: 1rem; }

.form-group label {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 0.4rem;
}

.form-control {
    width: 100%;
    padding: 0.8rem 1rem;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--cream);
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    transition: all var(--t) var(--ease);
}

.form-control:focus {
    outline: none;
    border-color: var(--ochre);
    background: var(--paper);
    box-shadow: 0 0 0 3px rgba(200, 134, 44, 0.14);
}

.form-control[type="file"] {
    padding: 0.65rem 0.9rem;
    border-style: dashed;
    cursor: pointer;
}

.form-control[type="file"]:hover {
    border-color: var(--ochre);
    background: var(--paper);
}

.form-control[type="file"]::file-selector-button {
    padding: 0.4rem 0.9rem;
    margin-right: 0.75rem;
    background: var(--ink);
    color: var(--cream);
    border: none;
    border-radius: var(--r-sm);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    font-family: inherit;
    transition: background var(--t) var(--ease);
}

.form-control[type="file"]::file-selector-button:hover {
    background: var(--ochre);
    color: var(--ink);
}

.form-hint {
    display: block;
    margin-top: 0.4rem;
    font-size: 0.72rem;
    color: var(--text-faint);
    line-height: 1.5;
}

/* ---------- Buttons ---------- */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.7rem 1.3rem;
    border: none;
    border-radius: var(--r-sm);
    font-family: var(--font-ui);
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-decoration: none;
    transition: all var(--t) var(--ease);
    white-space: nowrap;
}

.btn i { font-size: 0.8rem; }

.btn:disabled { opacity: 0.55; cursor: not-allowed; }

.btn-primary {
    background: var(--ink);
    color: var(--cream);
}
.btn-primary:hover:not(:disabled) {
    background: var(--ochre);
    color: var(--ink);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
}

.btn-success {
    background: var(--sage);
    color: var(--cream);
}
.btn-success:hover:not(:disabled) {
    background: #677a5c;
    transform: translateY(-1px);
}

.btn-danger {
    background: var(--terracotta);
    color: var(--cream);
}
.btn-danger:hover:not(:disabled) {
    background: #8b3d24;
    transform: translateY(-1px);
}

.btn-warning {
    background: var(--warning-soft);
    color: var(--warning);
    border: 1px solid rgba(138, 90, 16, 0.3);
}
.btn-warning:hover:not(:disabled) {
    background: var(--warning);
    color: var(--cream);
    border-color: var(--warning);
}

.btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line-strong);
}
.btn-secondary:hover:not(:disabled) {
    background: var(--cream);
    border-color: var(--ochre);
}

.btn-sm {
    padding: 0.45rem 0.85rem;
    font-size: 0.75rem;
}

/* ---------- Messages ---------- */
.message {
    display: none;
    padding: 0.85rem 1.1rem;
    border-radius: var(--r-sm);
    margin-bottom: 1.25rem;
    font-size: 0.88rem;
    font-weight: 600;
    line-height: 1.5;
    border-left: 4px solid transparent;
}

.message.success {
    display: block;
    background: var(--success-soft);
    color: var(--success);
    border-left-color: var(--success);
}
.message.error {
    display: block;
    background: var(--danger-soft);
    color: var(--danger);
    border-left-color: var(--danger);
}
.message.loading {
    display: block;
    background: var(--cream-deep);
    color: var(--text);
    border-left-color: var(--ochre);
}

/* ---------- Progress ---------- */
.progress-container {
    width: 100%;
    height: 26px;
    background: var(--cream-deep);
    border-radius: 999px;
    margin: 1rem 0;
    overflow: hidden;
    display: none;
    position: relative;
    border: 1px solid var(--line);
}

.progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--ochre), var(--ochre-bright));
    width: 0%;
    transition: width 0.3s var(--ease);
}

.progress-text {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--ink);
}

/* ---------- Event List ---------- */
.event-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1.25rem;
    flex-wrap: wrap;
    padding: 1.1rem 1.3rem;
    margin-bottom: 0.7rem;
    background: var(--cream);
    border: 1px solid var(--line);
    border-left: 4px solid var(--ochre);
    border-radius: var(--r);
    transition: all var(--t) var(--ease);
}

.event-item:hover {
    background: var(--paper);
    box-shadow: var(--shadow-sm);
}

.event-item:last-child { margin-bottom: 0; }

.event-info { flex: 1; min-width: 200px; }

.event-title {
    font-family: var(--font-display);
    font-variation-settings: 'SOFT' 30, 'WONK' 1;
    font-weight: 600;
    font-size: 1.02rem;
    color: var(--ink);
    letter-spacing: -0.005em;
    line-height: 1.3;
    margin-bottom: 0.35rem;
}

.event-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.85rem;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--text-faint);
}

.event-meta span {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
}

.event-meta i { color: var(--ochre); font-size: 0.7rem; }

.event-actions {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    flex-shrink: 0;
}

/* ---------- Image Grid ---------- */
.image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.9rem;
    margin-top: 1rem;
    width: 100%;
    grid-column: 1 / -1;
}

.image-grid-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 1.5rem;
    color: var(--text-faint);
    font-size: 0.88rem;
    font-style: italic;
}

.image-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--r);
    overflow: hidden;
    position: relative;
    transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
}

.image-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow);
}

.image-card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    display: block;
    background: var(--cream-deep);
}

.image-card .image-error {
    width: 100%;
    height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    background: var(--cream-deep);
    color: var(--danger);
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
}

.image-card .image-error i { font-size: 1.5rem; }

.image-card .image-caption {
    padding: 0.6rem 0.8rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--paper);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
    border-top: 1px solid var(--line);
}

.image-card .delete-btn {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    background: rgba(160, 44, 44, 0.9);
    color: var(--cream);
    border: none;
    border-radius: 50%;
    font-size: 0.8rem;
    cursor: pointer;
    z-index: 10;
    transition: all var(--t) var(--ease);
}

.image-card .delete-btn:hover {
    background: var(--danger);
    transform: scale(1.08);
}

.delete-cloud-btn {
    width: calc(100% - 12px);
    margin: 0 6px 6px;
    padding: 0.5rem 0.6rem;
    border: 1px solid rgba(200, 134, 44, 0.5);
    border-radius: var(--r-sm);
    background: var(--ochre-soft);
    color: var(--warning);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all var(--t) var(--ease);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
}

.delete-cloud-btn:hover:not(:disabled) {
    background: var(--ochre);
    color: var(--ink);
    border-color: var(--ochre);
}

.delete-cloud-btn:disabled {
    cursor: not-allowed;
    opacity: 0.55;
}

/* ---------- Hidden + Empty ---------- */
.hidden { display: none !important; }

.empty-state {
    text-align: center;
    padding: 3rem 1.5rem;
    color: var(--text-faint);
    font-size: 0.95rem;
}

.empty-state i {
    display: block;
    font-size: 2.2rem;
    color: var(--line-strong);
    margin-bottom: 0.75rem;
}

/* ---------- Responsive ---------- */
@media (max-width: 720px) {
    .admin-header {
        flex-direction: column;
        align-items: stretch;
    }
    .admin-header .links { justify-content: flex-start; }

    .form-row { grid-template-columns: 1fr; }

    .event-item { flex-direction: column; }
    .event-actions { width: 100%; }
    .event-actions .btn { flex: 1; justify-content: center; }

    .image-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    }

    .image-card img,
    .image-card .image-error { height: 110px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
<body>

<div class="admin-wrapper">

    <!-- ===== HEADER ===== -->
    <header class="admin-header">
        <h1><i class="fas fa-images"></i> Gallery Manager</h1>
        <div class="links">
            <a href="admin.html"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <a href="index.html"><i class="fas fa-globe"></i> View Site</a>
            <button type="button" onclick="cleanupBrokenImages()">
                <i class="fas fa-broom"></i> Clean Broken
            </button>
            <button type="button" class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </header>

    <!-- ===== CREATE EVENT ===== -->
    <section class="card">
        <h2 class="card-title"><i class="fas fa-calendar-plus"></i> Create New Event</h2>

        <div id="eventMessage" class="message"></div>

        <div class="form-row">
            <div class="form-group">
                <label for="eventTitle">Event Title</label>
                <input type="text" id="eventTitle" class="form-control" placeholder="e.g. Sports Day 2026">
            </div>
            <div class="form-group">
                <label for="eventDate">Event Date</label>
                <input type="date" id="eventDate" class="form-control">
            </div>
        </div>

        <div class="form-group">
            <label for="eventDescription">Description (optional)</label>
            <input type="text" id="eventDescription" class="form-control" placeholder="Brief description">
        </div>

        <button class="btn btn-success" id="createEventBtn" onclick="createGalleryEvent()" disabled>
            <i class="fas fa-plus"></i> Create Event
        </button>
    </section>

    <!-- ===== UPLOAD ===== -->
    <section class="card hidden" id="uploadSection">
        <h2 class="card-title">
            <i class="fas fa-cloud-upload-alt"></i>
            Upload Images to <span class="event-name" id="selectedEventTitle"></span>
        </h2>

        <div id="uploadMessage" class="message"></div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <div class="form-group">
            <label for="imageFiles">Choose Images</label>
            <input type="file" id="imageFiles" class="form-control" accept="image/*" multiple>
            <small class="form-hint">Max 5 MB per image. Supports JPG, PNG, GIF, WebP.</small>
        </div>

        <div class="form-group">
            <label for="imageCaption">Caption (optional)</label>
            <input type="text" id="imageCaption" class="form-control" placeholder="Applies to all selected images">
        </div>

        <input type="hidden" id="selectedEventId">

        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
            <button class="btn btn-primary" id="uploadImagesBtn" onclick="uploadImages()">
                <i class="fas fa-cloud-upload-alt"></i> Upload Images
            </button>
            <button class="btn btn-secondary" onclick="cancelUpload()">Cancel</button>
        </div>
    </section>

    <!-- ===== EVENTS LIST ===== -->
    <section class="card">
        <h2 class="card-title"><i class="fas fa-list"></i> Events</h2>
        <div id="eventsList">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                Loading events…
            </div>
        </div>
    </section>

</div>

<!-- ===== FIREBASE SDK ===== -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
(function () {
    'use strict';

    /* =========================================================
       CONFIG
       ========================================================= */
    var CONFIG = {
        firebase: {
            apiKey: "AIzaSyAHmBCyGlSo1puz1LZ7k-4twg_XAcOqyRA",
            authDomain: "svgms-backend.firebaseapp.com",
            projectId: "svgms-backend",
            storageBucket: "svgms-backend.firebasestorage.app",
            messagingSenderId: "1065359559935",
            appId: "1:1065359559935:web:977cea73a68e05813750ca"
        },
        cloudinary: {
            cloudName: "zh3vg8mi",
            uploadPreset: "school_notices"
        },
        maxImageSizeMB: 5
    };

    /* =========================================================
       INIT
       ========================================================= */
    firebase.initializeApp(CONFIG.firebase);
    var auth = firebase.auth();
    var db = firebase.firestore();

    var currentEventId = null;
    var imageCache = {};
    var galleryUser = null;
    var galleryAuthorized = false;

    /* =========================================================
       HELPERS
       ========================================================= */
    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function formatDate(value) {
        if (!value) return '';
        try {
            var d = new Date(value);
            if (isNaN(d.getTime())) return String(value);
            return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        } catch (e) { return String(value); }
    }

    function showMessage(elementId, text, type) {
        var el = document.getElementById(elementId);
        if (!el) return;
        el.textContent = text;
        el.className = 'message ' + type;

        if (type === 'success' || type === 'error') {
            setTimeout(function () {
                el.className = 'message';
                el.textContent = '';
            }, 5000);
        }
    }

    /* =========================================================
       AUTH GUARD
       ========================================================= */
    auth.onAuthStateChanged(function (user) {
        if (!user) {
            window.location.href = 'admin.html';
            return;
        }

        galleryUser = user;

        db.collection('users').doc(user.uid).get()
            .then(function (userDoc) {
                var role = userDoc.exists ? userDoc.data().role : null;
                galleryAuthorized = role === 'admin' || role === 'staff';

                if (!galleryAuthorized) {
                    showMessage('eventMessage', 'Your account is not authorized to manage the gallery.', 'error');
                    return;
                }

                document.getElementById('createEventBtn').disabled = false;
                loadEvents();
            })
            .catch(function (err) {
                console.error('Gallery authorization error:', err);
                showMessage('eventMessage', 'Could not verify gallery permissions. Please sign in again.', 'error');
            });
    });

    /* =========================================================
       NAVIGATION
       ========================================================= */
    window.goToDashboard = function () { window.location.href = 'admin.html'; };
    window.goToSite      = function () { window.location.href = 'index.html'; };

    /* =========================================================
       CREATE EVENT
       ========================================================= */
    window.createGalleryEvent = function () {
        if (!galleryUser || !galleryAuthorized) {
            showMessage('eventMessage', 'You are not authorized to create gallery events.', 'error');
            return;
        }

        var title = document.getElementById('eventTitle').value.trim();
        var date = document.getElementById('eventDate').value;
        var description = document.getElementById('eventDescription').value.trim();

        if (!title) {
            showMessage('eventMessage', 'Please enter an event title.', 'error');
            return;
        }

        var btn = document.getElementById('createEventBtn');
        btn.disabled = true;
        showMessage('eventMessage', 'Creating event…', 'loading');

        db.collection('events').add({
            title: title,
            date: date || null,
            description: description || '',
            createdBy: galleryUser.uid,
            createdByEmail: galleryUser.email || '',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function () {
            showMessage('eventMessage', 'Event created.', 'success');
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventDescription').value = '';
            loadEvents();
        }).catch(function (err) {
            console.error(err);
            var message = err.code === 'permission-denied'
                ? 'Firestore denied this action. Confirm your account has the admin/staff role and Firestore rules allow event creation.'
                : 'Could not create event: ' + err.message;
            showMessage('eventMessage', message, 'error');
        }).finally(function () {
            btn.disabled = false;
        });
    };

    /* =========================================================
       LOAD EVENTS
       ========================================================= */
    function loadEvents() {
        var container = document.getElementById('eventsList');
        container.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i>Loading events…</div>';

        db.collection('events').orderBy('date', 'desc').get()
            .then(function (snapshot) {
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i>No events created yet.</div>';
                    return;
                }

                container.innerHTML = '';
                var promises = [];

                snapshot.forEach(function (doc) {
                    var event = doc.data();
                    var eventId = doc.id;

                    var promise = db.collection('eventImages')
                        .where('eventId', '==', eventId)
                        .get()
                        .then(function (imgSnap) {
                            var images = [];
                            imgSnap.forEach(function (imgDoc) {
                                images.push({ id: imgDoc.id, data: imgDoc.data() });
                            });
                            return renderEventCard(eventId, event, images);
                        });

                    promises.push(promise);
                });

                return Promise.all(promises);
            })
            .catch(function (err) {
                console.error(err);
                container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i>Could not load events.</div>';
            });
    }

    function renderEventCard(eventId, event, images) {
        var container = document.getElementById('eventsList');
        var title = escapeHtml(event.title);
        var desc = event.description ? escapeHtml(event.description) : '';
        var dateStr = event.date ? formatDate(event.date) : '';

        var div = document.createElement('div');
        div.className = 'event-item';

        var metaHtml = '';
        if (dateStr) metaHtml += '<span><i class="fas fa-calendar"></i>' + dateStr + '</span>';
        if (desc)    metaHtml += '<span>' + desc + '</span>';
        metaHtml += '<span><i class="fas fa-image"></i>' + images.length + ' image' + (images.length === 1 ? '' : 's') + '</span>';

        div.innerHTML =
            '<div class="event-info">' +
                '<div class="event-title">' + title + '</div>' +
                '<div class="event-meta">' + metaHtml + '</div>' +
            '</div>' +
            '<div class="event-actions">' +
                '<button class="btn btn-primary btn-sm" data-eventid="' + eventId + '" data-eventtitle="' + title + '" onclick="showUpload(this)"><i class="fas fa-plus"></i> Add</button>' +
                '<button class="btn btn-warning btn-sm" data-eventid="' + eventId + '" onclick="toggleManage(this)"><i class="fas fa-images"></i> Manage</button>' +
                '<button class="btn btn-danger btn-sm" data-eventid="' + eventId + '" onclick="deleteEvent(this)"><i class="fas fa-trash"></i> Delete</button>' +
            '</div>' +
            '<div id="manage-' + eventId + '" class="image-grid" style="display:none;">' +
                (images.length === 0
                    ? '<p class="image-grid-empty">No images in this event.</p>'
                    : '') +
            '</div>';

        container.appendChild(div);

        if (images.length > 0) {
            var grid = document.getElementById('manage-' + eventId);
            images.forEach(function (img) {
                grid.appendChild(createImageCard(img.id, img.data, eventId, true));
            });
        }

        return Promise.resolve();
    }

    /* =========================================================
       TOGGLE MANAGE
       ========================================================= */
    window.toggleManage = function (button) {
        var eventId = button.getAttribute('data-eventid');
        var container = document.getElementById('manage-' + eventId);
        if (!container) return;

        if (container.style.display === 'none') {
            container.style.display = 'grid';
            refreshImages(eventId);
        } else {
            container.style.display = 'none';
        }
    };

    /* =========================================================
       REFRESH IMAGES
       ========================================================= */
    function refreshImages(eventId) {
        var grid = document.getElementById('manage-' + eventId);
        if (!grid) return;

        grid.innerHTML = '<p class="image-grid-empty">Loading images…</p>';

        db.collection('eventImages')
            .where('eventId', '==', eventId)
            .get()
            .then(function (snapshot) {
                if (snapshot.empty) {
                    grid.innerHTML = '<p class="image-grid-empty">No images in this event.</p>';
                    return;
                }

                grid.innerHTML = '';
                snapshot.forEach(function (doc) {
                    grid.appendChild(createImageCard(doc.id, doc.data(), eventId, true));
                });
            })
            .catch(function (err) {
                console.error(err);
                grid.innerHTML = '<p class="image-grid-empty" style="color:var(--danger);">Could not load images.</p>';
            });
    }

    /* =========================================================
       CREATE IMAGE CARD
       ========================================================= */
    function createImageCard(id, img, eventId, exists) {
        var card = document.createElement('div');
        card.className = 'image-card';

        var caption = img.caption || 'Untitled';
        var url = img.imageUrl || '';
        var publicId = img.publicId || '';

        var cloudBtn = publicId
            ? '<button class="delete-cloud-btn" data-imageid="' + escapeHtml(id) + '" data-eventid="' + escapeHtml(eventId) + '" data-publicid="' + escapeHtml(publicId) + '" onclick="deleteImageFromCloud(this)">' +
                  '<i class="fas fa-cloud"></i> Cloud + DB' +
              '</button>'
            : '<button class="delete-cloud-btn" disabled title="No Cloudinary public ID on this record"><i class="fas fa-cloud-slash"></i> No Cloud ID</button>';

        var dbBtn = '<button class="delete-btn" data-imageid="' + escapeHtml(id) + '" data-eventid="' + escapeHtml(eventId) + '" onclick="deleteImage(this)" aria-label="Delete DB record">' +
                        '<i class="fas fa-times"></i>' +
                    '</button>';

        if (exists && url) {
            card.innerHTML =
                dbBtn +
                '<img src="' + escapeHtml(url) + '" alt="' + escapeHtml(caption) + '" loading="lazy">' +
                '<div class="image-caption">' + escapeHtml(caption) + '</div>' +
                cloudBtn;
        } else {
            card.innerHTML =
                dbBtn +
                '<div class="image-error"><i class="fas fa-image"></i>Image not found</div>' +
                '<div class="image-caption">' + escapeHtml(caption) + '</div>' +
                cloudBtn;
        }

        return card;
    }

    /* =========================================================
       DELETE IMAGE (DB ONLY)
       ========================================================= */
    window.deleteImage = function (button) {
        var imageId = button.getAttribute('data-imageid');
        var eventId = button.getAttribute('data-eventid');

        if (!confirm('Remove this image from the database? The Cloudinary file will remain.')) return;

        db.collection('eventImages').doc(imageId).delete()
            .then(function () {
                showMessage('eventMessage', 'Image record deleted.', 'success');
                refreshImages(eventId);
                loadEvents();
            })
            .catch(function (err) {
                showMessage('eventMessage', 'Error: ' + err.message, 'error');
            });
    };

    /* =========================================================
       DELETE IMAGE FROM CLOUDINARY + DB
       ========================================================= */
    window.deleteImageFromCloud = async function (button) {
        var imageId = button.getAttribute('data-imageid');
        var eventId = button.getAttribute('data-eventid');
        var publicId = button.getAttribute('data-publicid') || '';
        if (!publicId) return;
        if (!confirm('Delete this image from Cloudinary AND remove its database record?')) return;

        button.disabled = true;

        try {
            var token = await auth.currentUser.getIdToken();

            var response = await fetch('/api/delete-cloudinary-image', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    publicId: publicId,
                    resourceType: 'image',
                    type: 'upload'
                })
            });

            var result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Cloudinary deletion failed');

            await db.collection('eventImages').doc(imageId).delete();

            showMessage('eventMessage', 'Image deleted from Cloudinary and database.', 'success');
            refreshImages(eventId);
            loadEvents();
        } catch (err) {
            button.disabled = false;
            showMessage('eventMessage', err.message, 'error');
        }
    };

    /* =========================================================
       DELETE EVENT
       ========================================================= */
    window.deleteEvent = function (button) {
        var eventId = button.getAttribute('data-eventid');

        if (!confirm('Delete this event and all its image records? This cannot be undone.')) return;

        db.collection('eventImages')
            .where('eventId', '==', eventId)
            .get()
            .then(function (snapshot) {
                var batch = db.batch();
                snapshot.forEach(function (doc) { batch.delete(doc.ref); });
                return batch.commit();
            })
            .then(function () {
                return db.collection('events').doc(eventId).delete();
            })
            .then(function () {
                showMessage('eventMessage', 'Event deleted.', 'success');
                loadEvents();
            })
            .catch(function (err) {
                showMessage('eventMessage', 'Error: ' + err.message, 'error');
            });
    };

    /* =========================================================
       SHOW UPLOAD
       ========================================================= */
    window.showUpload = function (button) {
        var eventId = button.getAttribute('data-eventid');
        var eventTitle = button.getAttribute('data-eventtitle');

        currentEventId = eventId;
        document.getElementById('selectedEventId').value = eventId;
        document.getElementById('selectedEventTitle').textContent = eventTitle;
        document.getElementById('uploadSection').classList.remove('hidden');
        document.getElementById('uploadSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    window.cancelUpload = function () {
        document.getElementById('uploadSection').classList.add('hidden');
        document.getElementById('imageFiles').value = '';
        document.getElementById('imageCaption').value = '';
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressText').textContent = '0%';
        document.getElementById('progressContainer').style.display = 'none';
        currentEventId = null;
    };

    /* =========================================================
       UPLOAD IMAGES
       ========================================================= */
    window.uploadImages = function () {
        var filesInput = document.getElementById('imageFiles');
        var files = filesInput.files;
        var caption = document.getElementById('imageCaption').value.trim();
        var eventId = document.getElementById('selectedEventId').value;
        var btn = document.getElementById('uploadImagesBtn');

        if (!files.length) {
            showMessage('uploadMessage', 'Please select at least one image.', 'error');
            return;
        }
        if (!eventId) {
            showMessage('uploadMessage', 'No event selected.', 'error');
            return;
        }

        var maxSize = CONFIG.maxImageSizeMB * 1024 * 1024;
        for (var i = 0; i < files.length; i++) {
            if (files[i].size > maxSize) {
                showMessage('uploadMessage', files[i].name + ' exceeds ' + CONFIG.maxImageSizeMB + ' MB limit.', 'error');
                return;
            }
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading…';
        document.getElementById('progressContainer').style.display = 'block';
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressText').textContent = '0%';
        showMessage('uploadMessage', 'Uploading ' + files.length + ' image' + (files.length === 1 ? '' : 's') + '…', 'loading');

        var uploaded = 0;
        var errors = 0;
        var total = files.length;
        var idx = 0;

        function processNext() {
            if (idx >= total) {
                document.getElementById('progressBar').style.width = '100%';
                document.getElementById('progressText').textContent = '100%';

                if (errors === 0) {
                    showMessage('uploadMessage', uploaded + ' image' + (uploaded === 1 ? '' : 's') + ' uploaded.', 'success');
                } else {
                    showMessage('uploadMessage', uploaded + ' uploaded, ' + errors + ' failed.', 'error');
                }

                filesInput.value = '';
                document.getElementById('imageCaption').value = '';

                setTimeout(function () {
                    document.getElementById('progressContainer').style.display = 'none';
                    document.getElementById('progressBar').style.width = '0%';
                    document.getElementById('progressText').textContent = '0%';
                }, 3000);

                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload Images';
                loadEvents();
                return;
            }

            var file = files[idx];
            var progress = Math.round((idx / total) * 100);
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressText').textContent = progress + '%';
            showMessage('uploadMessage', 'Processing ' + (idx + 1) + '/' + total + ': ' + file.name, 'loading');

            var formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CONFIG.cloudinary.uploadPreset);

            fetch('https://api.cloudinary.com/v1_1/' + CONFIG.cloudinary.cloudName + '/upload', {
                method: 'POST',
                body: formData
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.secure_url) {
                    return db.collection('eventImages').add({
                        eventId: eventId,
                        imageUrl: data.secure_url,
                        publicId: data.public_id || '',
                        caption: caption || '',
                        order: Date.now() + idx,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).then(function () { uploaded++; });
                } else {
                    errors++;
                    console.error('Upload failed:', data);
                }
            })
            .catch(function (err) {
                console.error('Upload error:', err);
                errors++;
            })
            .finally(function () {
                idx++;
                var p = Math.round((idx / total) * 100);
                document.getElementById('progressBar').style.width = p + '%';
                document.getElementById('progressText').textContent = p + '%';
                processNext();
            });
        }

        processNext();
    };

    /* =========================================================
       CLEANUP BROKEN IMAGES
       ========================================================= */
    window.cleanupBrokenImages = function () {
        if (!confirm('Check every image and delete records whose file is unreachable. Continue?')) return;

        showMessage('eventMessage', 'Scanning images…', 'loading');

        db.collection('eventImages').get()
            .then(function (snapshot) {
                if (snapshot.empty) {
                    showMessage('eventMessage', 'No images to check.', 'success');
                    return;
                }

                var deleted = 0;
                var checked = 0;
                var promises = [];

                snapshot.forEach(function (doc) {
                    var data = doc.data();
                    if (data.imageUrl) {
                        promises.push(
                            checkImage(data.imageUrl).then(function (exists) {
                                checked++;
                                if (!exists) {
                                    return db.collection('eventImages').doc(doc.id).delete().then(function () {
                                        deleted++;
                                    });
                                }
                            })
                        );
                    }
                });

                return Promise.all(promises).then(function () {
                    imageCache = {};
                    showMessage('eventMessage', 'Checked ' + checked + ' images. Deleted ' + deleted + ' broken.', 'success');
                    loadEvents();
                });
            })
            .catch(function (err) {
                console.error(err);
                showMessage('eventMessage', 'Error: ' + err.message, 'error');
            });
    };

    /* =========================================================
       CHECK IMAGE
       ========================================================= */
    function checkImage(url) {
        return new Promise(function (resolve) {
            if (!url || url.indexOf('http') !== 0) { resolve(false); return; }
            if (imageCache[url] !== undefined) { resolve(imageCache[url]); return; }

            var img = new Image();
            var resolved = false;

            var timeout = setTimeout(function () {
                if (!resolved) {
                    resolved = true;
                    imageCache[url] = false;
                    resolve(false);
                }
            }, 3000);

            img.onload = function () {
                if (!resolved) {
                    resolved = true;
                    clearTimeout(timeout);
                    imageCache[url] = true;
                    resolve(true);
                }
            };

            img.onerror = function () {
                if (!resolved) {
                    resolved = true;
                    clearTimeout(timeout);
                    imageCache[url] = false;
                    resolve(false);
                }
            };

            img.src = url;
        });
    }

    /* =========================================================
       LOGOUT
       ========================================================= */
    window.logout = function () {
        auth.signOut().then(function () {
            window.location.href = 'admin.html';
        });
    };

    /* Expose helpers used by inline handlers that reference window scope */
    window.escapeHtml = escapeHtml;
    window.formatDate = formatDate;
})();
</script>
