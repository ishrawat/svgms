<!-- ============================================================
     🚀 STUDENT ZONE - HEADER COMPONENT
     ============================================================ -->

<header style="display:flex; justify-content:space-between; align-items:center; padding:0.5rem 0 1.5rem 0; flex-wrap:wrap; gap:1rem;">

    <!-- ===== LEFT: Branding ===== -->
    <div style="display:flex; align-items:center; gap:0.8rem;">
        <span style="font-size:1.8rem;">🚀</span>
        <div>
            <div style="font-size:1.2rem; font-weight:700; background:linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">
                STUDENT ZONE
            </div>
            <div style="font-size:0.6rem; color:var(--text-muted); letter-spacing:2px; text-transform:uppercase;">
                SVGMS • Bhim • Rajasthan
            </div>
        </div>
    </div>

    <!-- ===== RIGHT: Navigation ===== -->
    <div style="display:flex; align-items:center; gap:0.8rem; flex-wrap:wrap;">

        <!-- Student Name (shown after login) -->
        <span id="studentName" style="font-size:0.85rem; color:var(--text-gray); display:none;"></span>

        <!-- Dashboard Link -->
        <a href="../dashboard.html" style="color:var(--neon-cyan); text-decoration:none; font-size:0.85rem; transition:var(--transition); padding:0.3rem 0.5rem; border-radius:6px;" 
           onmouseover="this.style.background='rgba(0,212,255,0.1)'; this.style.textShadow='0 0 20px rgba(0,212,255,0.3)'" 
           onmouseout="this.style.background='transparent'; this.style.textShadow='none'">
            🏠 Dashboard
        </a>

        <!-- Logout Button -->
        <button onclick="studentLogout()" 
                style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:var(--text-gray); padding:0.3rem 1rem; border-radius:8px; cursor:pointer; transition:var(--transition); font-size:0.8rem; font-family:inherit;"
                onmouseover="this.style.background='rgba(255,45,117,0.15)'; this.style.borderColor='var(--neon-pink)'; this.style.color='var(--neon-pink)'" 
                onmouseout="this.style.background='rgba(255,255,255,0.05)'; this.style.borderColor='rgba(255,255,255,0.08)'; this.style.color='var(--text-gray)'">
            🚪 Exit
        </button>

    </div>

</header>

<!-- ===== RESPONSIVE ===== -->
<style>
    @media (max-width: 480px) {
        header {
            flex-direction: column;
            text-align: center;
            padding-bottom: 1rem;
        }
        header > div:last-child {
            justify-content: center;
        }
    }
</style>

<!-- ===== LOGOUT FUNCTION ===== -->
<script>
    function studentLogout() {
        if (confirm('Exit Student Zone?')) {
            firebase.auth().signOut().then(() => {
                window.location.href = '../login.html';
            });
        }
    }

    // ===== SHOW STUDENT NAME (if logged in) =====
    firebase.auth().onAuthStateChanged(function(user) {
        if (user) {
            const nameEl = document.getElementById('studentName');
            if (nameEl) {
                // Try to get name from Firestore
                firebase.firestore().collection('students').doc(user.uid).get()
                    .then(doc => {
                        if (doc.exists) {
                            nameEl.textContent = '👋 ' + doc.data().name;
                            nameEl.style.display = 'inline';
                        } else {
                            nameEl.textContent = '👋 ' + (user.displayName || user.email);
                            nameEl.style.display = 'inline';
                        }
                    })
                    .catch(() => {
                        nameEl.textContent = '👋 ' + (user.displayName || user.email);
                        nameEl.style.display = 'inline';
                    });
            }
        }
    });
</script>
