<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Bhamashah - Admin</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="icon" href="imgs/logo1.png" type="image/png" />

  
</head>
<body>

    <div class="admin-wrapper">

        <header class="admin-header">
            <h1>🙏 Manage Bhamashah</h1>
            <div class="links">
                <a href="admin.html">← Dashboard</a>
                <a href="index.html">Website</a>
                <button class="btn-logout" onclick="logout()">🚪 Logout</button>
            </div>
        </header>

        <!-- Add Donor Form -->
        <div class="form-section">
            <h2>➕ Add Donor</h2>
            <div id="toast" class="toast"></div>
            <form id="donorForm" onsubmit="addDonor(event)">
                <label for="donorName">Donor Name *</label>
                <input type="text" id="donorName" placeholder="e.g., Mr. Rajesh Sharma" required>

                <label for="donorDonation">Donation Details *</label>
                <input type="text" id="donorDonation" placeholder="e.g., ₹50,000 for Computers" required>

                <label for="donorDescription">Description (Optional)</label>
                <textarea id="donorDescription" placeholder="Brief description about the donation..."></textarea>

                <div class="file-input">
                    <label for="donorPhoto">Photo</label>
                    <input type="file" id="donorPhoto" accept="image/*">
                    <small style="color:var(--text-muted); font-size:0.8rem;">Recommended: Square image, JPG or PNG</small>
                </div>

                <div id="progressContainer">
                    <div class="progress-label">
                        <span id="progressText">Uploading photo...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn-primary" id="addBtn">➕ Add Donor</button>
                    <button type="reset" class="btn-cancel" onclick="clearForm()">Clear</button>
                </div>
            </form>
        </div>

        <!-- Donors List -->
        <div class="list-section">
            <h2>📋 All Donors</h2>
            <div id="donorsList">
                <div class="empty-state">Loading donors...</div>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyAHmBCyGlSo1puz1LZ7k-4twg_XAcOqyRA",
            authDomain: "svgms-backend.firebaseapp.com",
            projectId: "svgms-backend",
            storageBucket: "svgms-backend.firebasestorage.app",
            messagingSenderId: "1065359559935",
            appId: "1:1065359559935:web:977cea73a68e05813750ca"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== CLOUDINARY CONFIG =====
        const CLOUDINARY = {
            cloudName: "zh3vg8mi",
            uploadPreset: "school_notices"
        };

        // ===== DOM REFS =====
        const donorsList = document.getElementById('donorsList');
        const toast = document.getElementById('toast');
        const addBtn = document.getElementById('addBtn');

        // ===== CHECK LOGIN =====
        auth.onAuthStateChanged(function(user) {
            if (!user) window.location.href = 'admin.html';
            else loadDonors();
        });

        // ===== ADD DONOR =====
        async function addDonor(event) {
            event.preventDefault();

            const name = document.getElementById('donorName').value.trim();
            const donation = document.getElementById('donorDonation').value.trim();
            const description = document.getElementById('donorDescription').value.trim();
            let file = document.getElementById('donorPhoto').files[0];
            if (file) {
                // Compress to 400x400, 70% quality
                file = await compressImage(file, 400, 400, 0.7);
            }
            if (!name) {
                showToast('Please enter the donor name.', 'error');
                return;
            }

            if (!donation) {
                showToast('Please enter donation details.', 'error');
                return;
            }

            addBtn.disabled = true;
            addBtn.textContent = 'Adding...';
            showToast('Adding donor...', 'loading');

            try {
                let photoUrl = '';

                // Upload photo if selected
                if (file) {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', CLOUDINARY.uploadPreset);
                    formData.append('resource_type', 'auto');

                    const response = await fetch(
                        `https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/upload`,
                        { method: 'POST', body: formData }
                    );

                    const data = await response.json();
                    if (data.secure_url) {
                        photoUrl = data.secure_url;
                    }
                }

                // Save to Firestore
                await db.collection('donors').add({
                    name: name,
                    donation: donation,
                    description: description || '',
                    photoUrl: photoUrl,
                    date: new Date().toISOString()
                });

                showToast('✅ Donor added successfully!', 'success');
                document.getElementById('donorForm').reset();
                document.getElementById('donorPhoto').value = '';
                loadDonors();

            } catch (error) {
                console.error('Error:', error);
                showToast('❌ Error: ' + error.message, 'error');
            }

            addBtn.disabled = false;
            addBtn.textContent = '➕ Add Donor';
        }

        // ===== LOAD DONORS =====
        async function loadDonors() {
            donorsList.innerHTML = '<div class="empty-state">Loading donors...</div>';

            try {
                const snapshot = await db.collection('donors')
                    .orderBy('date', 'desc')
                    .get();

                if (snapshot.empty) {
                    donorsList.innerHTML = '<div class="empty-state">No donors added yet.</div>';
                    return;
                }

                donorsList.innerHTML = '';
                snapshot.forEach(doc => {
                    const donor = doc.data();
                    const id = doc.id;

                    const date = donor.date ? new Date(donor.date) : new Date();
                    const formattedDate = date.toLocaleDateString('en-IN', {
                        day: '2-digit',
                        month: 'short',
                        year: 'numeric'
                    });

                    const item = document.createElement('div');
                    item.className = 'donor-item';
                    item.innerHTML = `
                        <div class="info">
                            <div class="name">${donor.name}</div>
                            <div class="meta">
                                ${donor.donation || ''}
                                ${donor.description ? `| ${donor.description}` : ''}
                                | 📅 ${formattedDate}
                                ${donor.photoUrl ? '| 📸 Photo' : ''}
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-delete" onclick="deleteDonor('${id}')">🗑️ Delete</button>
                        </div>
                    `;
                    donorsList.appendChild(item);
                });

            } catch (error) {
                console.error('Error loading donors:', error);
                donorsList.innerHTML = '<div class="empty-state">❌ Error loading donors</div>';
            }
        }

        // ===== DELETE DONOR =====
        async function deleteDonor(id) {
            if (!confirm('Delete this donor?')) return;

            try {
                await db.collection('donors').doc(id).delete();
                showToast('🗑️ Donor deleted!', 'success');
                loadDonors();
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        // ===== CLEAR FORM =====
        function clearForm() {
            document.getElementById('donorForm').reset();
            document.getElementById('donorPhoto').value = '';
            showToast('Form cleared.', 'success');
            setTimeout(() => { toast.style.display = 'none'; }, 1000);
        }

        // ===== TOAST =====
        function showToast(message, type) {
            toast.textContent = message;
            toast.className = 'toast ' + type;
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        // ===== LOGOUT =====
        function logout() {
            auth.signOut();
            window.location.href = 'admin.html';
        }

        // ===== COMPRESS IMAGE =====
        function compressImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        // Resize only if larger than max
                        if (width > maxWidth || height > maxHeight) {
                            const ratio = Math.min(maxWidth / width, maxHeight / height);
                            width = Math.round(width * ratio);
                            height = Math.round(height * ratio);
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

    </script>

</body>
</html>
