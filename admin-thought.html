<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Thought - Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/logo1.png" type="image/png" />

    <style>
        .admin-wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 3px solid var(--accent);
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .admin-header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin: 0;
        }

        .admin-header .links {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .admin-header .links a {
            color: var(--primary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: var(--transition);
            font-size: 0.95rem;
        }

        .admin-header .links a:hover {
            background: var(--bg-light);
        }

        .btn-logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .btn-logout:hover {
            background: #c82333;
        }

        .form-section {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border-top: 4px solid var(--accent);
        }

        .form-section h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .form-section .current-thought {
            background: var(--bg-light);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--accent);
        }

        .form-section .current-thought .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-section .current-thought .quote {
            font-size: 1rem;
            color: var(--text-dark);
            font-style: italic;
            margin: 0.3rem 0;
        }

        .form-section .current-thought .meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .form-section label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.3rem;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .form-section textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            background: var(--bg-light);
            min-height: 100px;
            resize: vertical;
            transition: var(--transition);
        }

        .form-section textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .form-section input[type="text"] {
            width: 100%;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            background: var(--bg-light);
            transition: var(--transition);
        }

        .form-section input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .form-section .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-section .btn-primary:hover {
            background: var(--primary-light);
        }

        .form-section .btn-danger {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            margin-left: 0.5rem;
        }

        .form-section .btn-danger:hover {
            background: #c82333;
        }

        .form-section .btn-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .toast {
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.95rem;
        }

        .toast.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .toast.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        @media (max-width: 768px) {
            .admin-wrapper {
                padding: 1rem;
            }
            .admin-header {
                flex-direction: column;
                text-align: center;
            }
            .form-section .btn-row {
                flex-direction: column;
            }
            .form-section .btn-primary,
            .form-section .btn-danger {
                width: 100%;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <div class="admin-wrapper">

        <header class="admin-header">
            <h1>💭 Thought of the Day</h1>
            <div class="links">
                <a href="admin.html">← Dashboard</a>
                <a href="index.html">Website</a>
                <button class="btn-logout" onclick="logout()">🚪 Logout</button>
            </div>
        </header>

        <div class="form-section">

            <h2>Update Thought</h2>

            <!-- Current Thought -->
            <div class="current-thought">
                <div class="label">Current Thought</div>
                <div id="currentQuote" class="quote">Loading...</div>
                <div id="currentMeta" class="meta">— Loading...</div>
            </div>

            <div id="toast" class="toast"></div>

            <form id="thoughtForm" onsubmit="updateThought(event)">
                <label for="thoughtMessage">New Thought / Quote *</label>
                <textarea id="thoughtMessage" placeholder="Enter the thought of the day..." required></textarea>

                <label for="thoughtAuthor">Author</label>
                <input type="text" id="thoughtAuthor" placeholder="e.g., Principal">

                <div class="btn-row">
                    <button type="submit" class="btn-primary" id="updateBtn">📤 Update Thought</button>
                    <button type="button" class="btn-danger" onclick="deleteThought()">🗑️ Remove Thought</button>
                </div>
            </form>

        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAHmBCyGlSo1puz1LZ7k-4twg_XAcOqyRA",
            authDomain: "svgms-backend.firebaseapp.com",
            projectId: "svgms-backend",
            storageBucket: "svgms-backend.firebasestorage.app",
            messagingSenderId: "1065359559935",
            appId: "1:1065359559935:web:977cea73a68e05813750ca"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const toast = document.getElementById('toast');
        const updateBtn = document.getElementById('updateBtn');

        auth.onAuthStateChanged(function(user) {
            if (!user) window.location.href = 'admin.html';
            else loadCurrentThought();
        });

        async function loadCurrentThought() {
            try {
                const doc = await db.collection('thoughts').doc('current').get();
                
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('currentQuote').textContent = `"${data.message}"`;
                    document.getElementById('currentMeta').textContent = `— ${data.author || 'Principal'} • ${new Date(data.date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}`;
                } else {
                    document.getElementById('currentQuote').textContent = 'No thought set yet.';
                    document.getElementById('currentMeta').textContent = '— Add a thought above';
                }
            } catch (error) {
                console.error('Error loading thought:', error);
            }
        }

        async function updateThought(event) {
            event.preventDefault();

            const message = document.getElementById('thoughtMessage').value.trim();
            const author = document.getElementById('thoughtAuthor').value.trim() || 'Principal';

            if (!message) {
                showToast('Please enter a thought.', 'error');
                return;
            }

            updateBtn.disabled = true;
            updateBtn.textContent = 'Updating...';
            showToast('Updating thought...', 'loading');

            try {
                await db.collection('thoughts').doc('current').set({
                    message: message,
                    author: author,
                    date: new Date().toISOString()
                });

                showToast('✅ Thought updated successfully!', 'success');
                document.getElementById('thoughtForm').reset();
                loadCurrentThought();

            } catch (error) {
                console.error('Error:', error);
                showToast('❌ Error: ' + error.message, 'error');
            }

            updateBtn.disabled = false;
            updateBtn.textContent = '📤 Update Thought';
        }

        async function deleteThought() {
            if (!confirm('Remove the current thought?')) return;

            try {
                await db.collection('thoughts').doc('current').delete();
                showToast('🗑️ Thought removed!', 'success');
                loadCurrentThought();
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        function showToast(message, type) {
            toast.textContent = message;
            toast.className = 'toast ' + type;
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        function logout() {
            auth.signOut();
            window.location.href = 'admin.html';
        }
    </script>

</body>
</html>
