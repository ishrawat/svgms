<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Shortlist - Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/logo1.png" type="image/png" />

    <style>
        .admin-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 3px solid var(--accent);
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .admin-header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin: 0;
        }

        .admin-header .links {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .admin-header .links a {
            color: var(--primary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: var(--transition);
            font-size: 0.95rem;
        }

        .admin-header .links a:hover {
            background: var(--bg-light);
        }

        .btn-logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .btn-logout:hover {
            background: #c82333;
        }

        .form-section {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            border-top: 4px solid var(--accent);
        }

        .form-section h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .form-section label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.3rem;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .form-section input,
        .form-section textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            background: var(--bg-light);
            transition: var(--transition);
        }

        .form-section input:focus,
        .form-section textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .form-section textarea {
            min-height: 70px;
            resize: vertical;
        }

        .form-section .file-input {
            margin-bottom: 1rem;
        }

        .form-section .file-input label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.3rem;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .form-section .file-input input[type="file"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: var(--bg-light);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .form-section .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-section .btn-primary:hover {
            background: var(--primary-light);
        }

        .form-section .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toast {
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.95rem;
        }

        .toast.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .toast.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .toast.loading {
            display: block;
            background: #e2e3e5;
            color: #383d41;
            border-left: 4px solid #6c757d;
        }

        .list-section {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .list-section h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .shortlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1rem;
            background: var(--bg-light);
            border-radius: 8px;
            margin-bottom: 0.6rem;
            border-left: 4px solid var(--accent);
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .shortlist-item .info {
            flex: 1;
        }

        .shortlist-item .info .title {
            font-weight: 600;
            color: var(--primary);
        }

        .shortlist-item .info .meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .shortlist-item .actions {
            display: flex;
            gap: 0.5rem;
        }

        .shortlist-item .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .shortlist-item .btn-delete:hover {
            background: #c82333;
        }

        .shortlist-item .btn-pdf {
            background: var(--accent);
            color: var(--primary);
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .shortlist-item .btn-pdf:hover {
            background: #c4a020;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .admin-wrapper {
                padding: 1rem;
            }
            .admin-header {
                flex-direction: column;
                text-align: center;
            }
            .shortlist-item {
                flex-direction: column;
                text-align: center;
            }
            .form-section .btn-primary {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="admin-wrapper">

        <header class="admin-header">
            <h1>📋 Manage Shortlist</h1>
            <div class="links">
                <a href="admin.html">← Dashboard</a>
                <a href="index.html">Website</a>
                <button class="btn-logout" onclick="logout()">🚪 Logout</button>
            </div>
        </header>

        <!-- Upload Section -->
        <div class="form-section">
            <h2>📤 Upload Shortlist PDF</h2>
            <div id="toast" class="toast"></div>
            <form id="shortlistForm" onsubmit="uploadShortlist(event)">
                <label for="shortlistTitle">Title *</label>
                <input type="text" id="shortlistTitle" placeholder="e.g., Class 11 Admission Shortlist" required>

                <label for="shortlistMessage">Message / Description</label>
                <textarea id="shortlistMessage" placeholder="Brief description about the shortlist..."></textarea>

                <div class="file-input">
                    <label for="shortlistPdf">PDF File *</label>
                    <input type="file" id="shortlistPdf" accept=".pdf" required>
                    <small style="color:var(--text-muted); font-size:0.8rem;">Only PDF files are allowed. Max size: 10MB</small>
                </div>

                <button type="submit" class="btn-primary" id="uploadBtn">📤 Upload Shortlist</button>
            </form>
        </div>

        <!-- Shortlists List -->
        <div class="list-section">
            <h2>📋 All Shortlists</h2>
            <div id="shortlistsList">
                <div class="empty-state">Loading shortlists...</div>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAHmBCyGlSo1puz1LZ7k-4twg_XAcOqyRA",
            authDomain: "svgms-backend.firebaseapp.com",
            projectId: "svgms-backend",
            storageBucket: "svgms-backend.firebasestorage.app",
            messagingSenderId: "1065359559935",
            appId: "1:1065359559935:web:977cea73a68e05813750ca"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const CLOUDINARY = {
            cloudName: "zh3vg8mi",
            uploadPreset: "school_notices"
        };

        const shortlistsList = document.getElementById('shortlistsList');
        const toast = document.getElementById('toast');
        const uploadBtn = document.getElementById('uploadBtn');

        auth.onAuthStateChanged(function(user) {
            if (!user) window.location.href = 'admin.html';
            else loadShortlists();
        });

        async function uploadShortlist(event) {
            event.preventDefault();

            const title = document.getElementById('shortlistTitle').value.trim();
            const message = document.getElementById('shortlistMessage').value.trim();
            const file = document.getElementById('shortlistPdf').files[0];

            if (!title || !file) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';
            showToast('Uploading shortlist...', 'loading');

            try {
                // Upload to Cloudinary
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY.uploadPreset);
                formData.append('resource_type', 'raw');

                const response = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/raw/upload`,
                    { method: 'POST', body: formData }
                );

                const data = await response.json();

                if (!data.secure_url) {
                    throw new Error('Upload failed');
                }

                // Save to Firestore
                await db.collection('shortlist').add({
                    title: title,
                    message: message || '',
                    pdfUrl: data.secure_url,
                    pdfName: file.name,
                    date: new Date().toISOString()
                });

                showToast('✅ Shortlist uploaded successfully!', 'success');
                document.getElementById('shortlistForm').reset();
                loadShortlists();

            } catch (error) {
                console.error('Upload error:', error);
                showToast('❌ Error: ' + error.message, 'error');
            }

            uploadBtn.disabled = false;
            uploadBtn.textContent = '📤 Upload Shortlist';
        }

        async function loadShortlists() {
            shortlistsList.innerHTML = '<div class="empty-state">Loading shortlists...</div>';

            try {
                const snapshot = await db.collection('shortlist')
                    .orderBy('date', 'desc')
                    .get();

                if (snapshot.empty) {
                    shortlistsList.innerHTML = '<div class="empty-state">No shortlists uploaded yet.</div>';
                    return;
                }

                shortlistsList.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;

                    const date = data.date ? new Date(data.date) : new Date();
                    const formattedDate = date.toLocaleDateString('en-IN', {
                        day: '2-digit',
                        month: 'short',
                        year: 'numeric'
                    });

                    const item = document.createElement('div');
                    item.className = 'shortlist-item';
                    item.innerHTML = `
                        <div class="info">
                            <div class="title">${data.title || 'Untitled'}</div>
                            <div class="meta">
                                ${data.message || ''}
                                ${data.message ? '|' : ''}
                                📅 ${formattedDate}
                                ${data.pdfName ? `| 📄 ${data.pdfName}` : ''}
                            </div>
                        </div>
                        <div class="actions">
                            <a href="${data.pdfUrl}" target="_blank" class="btn-pdf">📥 PDF</a>
                            <button class="btn-delete" onclick="deleteShortlist('${id}')">🗑️ Delete</button>
                        </div>
                    `;
                    shortlistsList.appendChild(item);
                });

            } catch (error) {
                console.error('Error loading shortlists:', error);
                shortlistsList.innerHTML = '<div class="empty-state">❌ Error loading shortlists</div>';
            }
        }

        async function deleteShortlist(id) {
            if (!confirm('Delete this shortlist?')) return;

            try {
                await db.collection('shortlist').doc(id).delete();
                showToast('🗑️ Shortlist deleted!', 'success');
                loadShortlists();
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        function showToast(message, type) {
            toast.textContent = message;
            toast.className = 'toast ' + type;
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        function logout() {
            auth.signOut();
            window.location.href = 'admin.html';
        }
    </script>

</body>
</html>
