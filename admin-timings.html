<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Timings - Admin</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="icon" href="imgs/logo1.png" type="image/png" />

 
</head>
<body>

    <div class="admin-wrapper">

        <header class="admin-header">
            <h1>⏰ School Timings</h1>
            <div class="links">
                <a href="admin.html">← Dashboard</a>
                <a href="index.html">Website</a>
                <button class="btn-logout" onclick="logout()">🚪 Logout</button>
            </div>
        </header>

        <div class="form-section">
            <h2>Update Timings</h2>
            
            <div id="message" class="message"></div>

            <div class="current-box">
                <div class="time" id="currentTime">Loading...</div>
                <div class="meta" id="currentDays">Loading...</div>
            </div>

            <form id="timingsForm" onsubmit="updateTimings(event)">
                <label for="startTime">Start Time</label>
                <input type="text" id="startTime" placeholder="8:00 AM" required>

                <label for="endTime">End Time</label>
                <input type="text" id="endTime" placeholder="3:00 PM" required>

                <label for="days">Days</label>
                <input type="text" id="days" placeholder="Monday - Friday" required>

                <button type="submit" id="updateBtn">🔄 Update Timings</button>
            </form>
        </div>

    </div>

    <!-- ===== FIREBASE SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAHmBCyGlSo1puz1LZ7k-4twg_XAcOqyRA",
            authDomain: "svgms-backend.firebaseapp.com",
            projectId: "svgms-backend",
            storageBucket: "svgms-backend.firebasestorage.app",
            messagingSenderId: "1065359559935",
            appId: "1:1065359559935:web:977cea73a68e05813750ca"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const form = document.getElementById('timingsForm');
        const updateBtn = document.getElementById('updateBtn');
        const message = document.getElementById('message');

        // ===== CHECK LOGIN =====
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'admin.html';
            } else {
                loadCurrentTimings();
            }
        });

        // ===== LOAD CURRENT TIMINGS =====
        async function loadCurrentTimings() {
            try {
                const doc = await db.collection('settings').doc('schoolTimings').get();
                
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('currentTime').textContent = `${data.startTime} - ${data.endTime}`;
                    document.getElementById('currentDays').textContent = data.days || 'Monday - Friday';
                    document.getElementById('startTime').value = data.startTime || '';
                    document.getElementById('endTime').value = data.endTime || '';
                    document.getElementById('days').value = data.days || '';
                }
            } catch (error) {
                console.error('Error loading timings:', error);
            }
        }

        // ===== UPDATE TIMINGS =====
        async function updateTimings(event) {
            event.preventDefault();

            const startTime = document.getElementById('startTime').value.trim();
            const endTime = document.getElementById('endTime').value.trim();
            const days = document.getElementById('days').value.trim();

            if (!startTime || !endTime || !days) {
                showMessage('❌ Please fill all fields', 'error');
                return;
            }

            updateBtn.disabled = true;
            updateBtn.textContent = 'Updating...';
            showMessage('Updating timings...', 'loading');

            try {
                await db.collection('settings').doc('schoolTimings').set({
                    startTime: startTime,
                    endTime: endTime,
                    days: days,
                    lastUpdated: new Date().toISOString()
                });

                showMessage('✅ Timings updated successfully!', 'success');
                loadCurrentTimings();

            } catch (error) {
                console.error('Error updating timings:', error);
                showMessage('❌ Error updating timings: ' + error.message, 'error');
            }

            updateBtn.disabled = false;
            updateBtn.textContent = '🔄 Update Timings';
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
        }

        function logout() {
            auth.signOut();
            window.location.href = 'admin.html';
        }
    </script>

</body>
</html>
