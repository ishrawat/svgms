<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard — SVGMS Bhim</title>
<link rel="icon" href="imgs/logo1.png" type="image/png">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ==========================================================================
   ADMIN DASHBOARD — standalone (does not use site.js chrome)
   Palette aligned to site design system.
   ========================================================================== */
:root {
    --ink:            #1a2b3c;
    --ink-deep:       #0d1a26;
    --ochre:          #c8862c;
    --ochre-bright:   #e0a347;
    --ochre-soft:     #f3e4c4;
    --terracotta:     #a84b2f;

    --cream:          #faf6ee;
    --cream-deep:     #f2e9d7;
    --paper:          #ffffff;

    --text:           #3a4a56;
    --text-faint:     #738290;

    --line:           rgba(26, 43, 60, 0.12);
    --line-strong:    rgba(26, 43, 60, 0.22);

    --success:        #1b7f4b;
    --danger:         #a02c2c;
    --warning:        #c8862c;

    --shadow-sm:      0 1px 2px rgba(26, 43, 60, 0.06);
    --shadow:         0 8px 28px rgba(26, 43, 60, 0.08);
    --shadow-lg:      0 22px 55px rgba(26, 43, 60, 0.14);

    --r-sm:           3px;
    --r:              5px;
    --r-lg:           10px;

    --ease:           cubic-bezier(0.4, 0, 0.2, 1);
    --ease-out:       cubic-bezier(0.16, 1, 0.3, 1);
    --t:              0.25s;

    --font-display:   'Fraunces', Georgia, serif;
    --font-ui:        'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    background:
        radial-gradient(ellipse 1000px 500px at 90% -100px, rgba(200, 134, 44, 0.08), transparent 60%),
        linear-gradient(180deg, #fafbfa, var(--cream));
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; max-width: 100%; height: auto; }

:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }

/* ---------- Layout ---------- */
.dashboard-wrapper {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    padding: clamp(1rem, 3vw, 2rem);
}

/* ---------- Login ---------- */
#loginPage {
    width: min(420px, 100%);
    margin: 9vh auto 0;
    background: var(--paper);
    padding: clamp(2rem, 5vw, 2.5rem);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg);
    border-top: 5px solid var(--ochre);
}

.login-logo {
    width: 78px;
    height: 78px;
    display: block;
    margin: 0 auto 1.2rem;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid var(--ochre);
    box-shadow: var(--shadow-sm);
}

#loginPage h2 {
    font-family: var(--font-display);
    font-variation-settings: 'SOFT' 30, 'WONK' 1;
    font-weight: 600;
    color: var(--ink);
    text-align: center;
    font-size: 1.55rem;
    letter-spacing: -0.01em;
    margin-bottom: 0.3rem;
}

.login-subtitle {
    text-align: center;
    color: var(--text-faint);
    font-size: 0.82rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 1.8rem;
    font-weight: 600;
}

#loginPage input {
    width: 100%;
    padding: 0.85rem 1rem;
    margin-bottom: 0.9rem;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--cream);
    font-size: 0.95rem;
    transition: all var(--t) var(--ease);
}

#loginPage input:focus {
    outline: none;
    border-color: var(--ochre);
    background: var(--paper);
    box-shadow: 0 0 0 3px rgba(200, 134, 44, 0.14);
}

#loginPage button {
    width: 100%;
    padding: 0.9rem;
    background: var(--ink);
    color: var(--cream);
    border: none;
    border-radius: var(--r-sm);
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.03em;
    transition: all var(--t) var(--ease);
}

#loginPage button:hover {
    background: var(--ochre);
    color: var(--ink);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
}

#loginMessage {
    margin-top: 1rem;
    text-align: center;
    font-size: 0.85rem;
    min-height: 20px;
}

/* ---------- Header ---------- */
.dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1.25rem;
    padding: 1.15rem 1.4rem;
    margin-bottom: 1.4rem;
    background: var(--paper);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    border-bottom: 3px solid var(--ochre);
}

.brand { display: flex; align-items: center; gap: 0.9rem; min-width: 0; }

.brand img {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid var(--ochre);
    background: var(--cream);
}

.brand h1 {
    font-family: var(--font-display);
    font-variation-settings: 'SOFT' 30, 'WONK' 1;
    font-weight: 600;
    color: var(--ink);
    font-size: 1.35rem;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-bottom: 0.15rem;
}

.brand small {
    display: block;
    color: var(--text-faint);
    font-size: 0.76rem;
    letter-spacing: 0.02em;
}

.user-info {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 0.55rem;
}

.email {
    color: var(--text);
    font-size: 0.8rem;
    background: var(--cream);
    padding: 0.5rem 0.85rem;
    border-radius: var(--r-sm);
    border: 1px solid var(--line);
}

.btn-back,
.btn-logout {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    border: none;
    padding: 0.6rem 1rem;
    border-radius: var(--r-sm);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-decoration: none;
    transition: all var(--t) var(--ease);
}

.btn-back {
    background: var(--ink);
    color: var(--cream);
}

.btn-back:hover {
    background: var(--ochre);
    color: var(--ink);
    transform: translateY(-1px);
}

.btn-logout {
    background: var(--terracotta);
    color: var(--cream);
}

.btn-logout:hover {
    background: #8b3d24;
    transform: translateY(-1px);
}

/* ---------- Welcome ---------- */
.welcome-banner {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, var(--ink), #2c3e50);
    color: var(--cream);
    padding: 1.75rem 2rem;
    border-radius: var(--r-lg);
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
}

.welcome-banner::after {
    content: '';
    position: absolute;
    width: 180px;
    height: 180px;
    right: -60px;
    top: -80px;
    border-radius: 50%;
    border: 25px solid rgba(200, 134, 44, 0.15);
    pointer-events: none;
}

.welcome-banner h2 {
    position: relative;
    z-index: 1;
    font-family: var(--font-display);
    font-variation-settings: 'SOFT' 30, 'WONK' 1;
    font-weight: 600;
    font-size: 1.4rem;
    letter-spacing: -0.01em;
    margin-bottom: 0.35rem;
}

.welcome-banner p {
    position: relative;
    z-index: 1;
    color: rgba(250, 246, 238, 0.78);
    font-size: 0.88rem;
    line-height: 1.6;
}

/* ---------- Dashboard cards ---------- */
.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 0.9rem;
    margin-bottom: 1.5rem;
}

.dash-card {
    position: relative;
    min-height: 145px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem 0.9rem 1.15rem;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: all var(--t) var(--ease-out);
    color: inherit;
    font-family: inherit;
    width: 100%;
}

.dash-card:hover {
    transform: translateY(-3px);
    border-color: var(--ochre);
    box-shadow: var(--shadow-lg);
}

.dash-card.active {
    border: 2px solid var(--ochre);
    background: linear-gradient(145deg, #fffdf6, var(--cream-deep));
    box-shadow: 0 5px 20px rgba(200, 134, 44, 0.14);
}

.dash-card .icon {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.7rem;
    background: var(--cream);
    border-radius: var(--r-lg);
    font-size: 1.6rem;
    color: var(--ink);
    transition: all var(--t) var(--ease);
}

.dash-card:hover .icon,
.dash-card.active .icon {
    background: var(--ochre-soft);
    color: var(--ochre);
    transform: scale(1.06);
}

.card-title {
    font-family: var(--font-display);
    font-variation-settings: 'SOFT' 30, 'WONK' 1;
    font-weight: 600;
    color: var(--ink);
    font-size: 0.92rem;
    letter-spacing: -0.005em;
    line-height: 1.25;
}

.card-subtitle {
    color: var(--text-faint);
    font-size: 0.72rem;
    line-height: 1.35;
    margin-top: 0.35rem;
    max-width: 180px;
}

.badge {
    position: absolute;
    top: 0.6rem;
    right: 0.6rem;
    padding: 0.25rem 0.5rem;
    border-radius: 20px;
    font-size: 0.58rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.badge.working { background: #dff5e6; color: #16703a; }
.badge.coming  { background: #fff3cd; color: #856404; }

/* ---------- Content area ---------- */
.content-area {
    background: var(--paper);
    padding: clamp(1.4rem, 3vw, 2rem);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    min-height: 320px;
    border: 1px solid var(--line);
}

.content-area h2 {
    font-family: var(--font-display);
    font-variation-settings: 'SOFT' 30, 'WONK' 1;
    font-weight: 600;
    color: var(--ink);
    font-size: 1.25rem;
    letter-spacing: -0.01em;
}

.content-area h3 {
    font-family: var(--font-display);
    font-weight: 600;
    color: var(--ink);
    font-size: 1rem;
    margin-bottom: 0.75rem;
}

.placeholder {
    min-height: 270px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--text-faint);
}

.placeholder .big-icon {
    margin-bottom: 0.9rem;
}

.placeholder p {
    font-size: 0.92rem;
    max-width: 40ch;
    line-height: 1.6;
}

.divider {
    margin: 0 0 1.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--line);
}

/* ---------- Post form ---------- */
.post-form input,
.post-form select,
.post-form textarea {
    width: 100%;
    padding: 0.75rem 0.9rem;
    margin-bottom: 0.75rem;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--cream);
    color: var(--text);
    font-size: 0.9rem;
    transition: all var(--t) var(--ease);
}

.post-form input:focus,
.post-form select:focus,
.post-form textarea:focus {
    outline: none;
    border-color: var(--ochre);
    background: var(--paper);
    box-shadow: 0 0 0 3px rgba(200, 134, 44, 0.12);
}

.post-form textarea {
    min-height: 130px;
    resize: vertical;
    line-height: 1.55;
}

.post-form button {
    background: var(--ink);
    color: var(--cream);
    border: none;
    padding: 0.75rem 1.25rem;
    border-radius: var(--r-sm);
    font-size: 0.86rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: all var(--t) var(--ease);
}

.post-form button:hover {
    background: var(--ochre);
    color: var(--ink);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
}

/* ---------- Post cards ---------- */
#adminPostsList { margin-top: 0.6rem; }

.post-card {
    background: var(--cream);
    padding: 1.1rem 1.2rem;
    margin-bottom: 0.7rem;
    border-radius: var(--r);
    border: 1px solid var(--line);
    border-left: 4px solid var(--ochre);
    transition: all var(--t) var(--ease);
}

.post-card:hover {
    box-shadow: var(--shadow-sm);
    background: var(--paper);
}

.post-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
}

.post-title {
    color: var(--ink);
    font-weight: 700;
    font-size: 0.95rem;
}

.post-category {
    display: inline-block;
    margin-left: 0.45rem;
    padding: 0.15rem 0.55rem;
    border-radius: 20px;
    background: var(--ochre-soft);
    color: var(--terracotta);
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
}

.post-meta {
    color: var(--text-faint);
    font-size: 0.72rem;
    margin-top: 0.3rem;
}

.post-content {
    margin-top: 0.6rem;
    color: var(--text);
    font-size: 0.86rem;
    line-height: 1.6;
    white-space: pre-wrap;
}

.post-actions {
    flex-shrink: 0;
    display: flex;
    gap: 0.4rem;
}

.post-actions button {
    padding: 0.45rem 0.75rem;
    border: none;
    border-radius: var(--r-sm);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
}

.btn-delete {
    background: #fce4e4;
    color: var(--danger);
    transition: all var(--t) var(--ease);
}

.btn-delete:hover {
    background: var(--danger);
    color: var(--cream);
}

/* ---------- Quick stats ---------- */
.quick-stats {
    display: grid;
    grid-template-columns: repeat(5, minmax(110px, 1fr));
    gap: 0.7rem;
    margin-top: 1.4rem;
    padding-top: 1.4rem;
    border-top: 1px solid var(--line);
}

.stat-item {
    text-align: center;
    background: var(--paper);
    padding: 0.9rem 0.6rem;
    border: 1px solid var(--line);
    border-radius: var(--r);
    transition: all var(--t) var(--ease);
}

.stat-item:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
    border-color: var(--ochre);
}

.stat-number {
    font-family: var(--font-display);
    font-variation-settings: 'SOFT' 30, 'WONK' 1;
    font-weight: 600;
    color: var(--ink);
    font-size: 1.5rem;
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
}

.stat-label {
    color: var(--text-faint);
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    font-weight: 600;
}

.stat-label i { color: var(--ochre); margin-right: 0.25rem; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
    .dashboard-grid { grid-template-columns: repeat(4, 1fr); }
    .quick-stats { grid-template-columns: repeat(5, 1fr); }
}

@media (max-width: 900px) {
    .dashboard-header { align-items: flex-start; }
    .user-info { width: 100%; justify-content: flex-start; }
    .dashboard-grid { grid-template-columns: repeat(3, 1fr); }
    .quick-stats { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 650px) {
    .dashboard-header { flex-direction: column; padding: 1.1rem; text-align: center; }
    .brand { width: 100%; justify-content: center; flex-direction: column; }
    .brand h1 { font-size: 1.2rem; }
    .user-info { justify-content: center; width: 100%; }
    .email { width: 100%; text-align: center; }
    .btn-back, .btn-logout { flex: 1; justify-content: center; }
    .welcome-banner { padding: 1.25rem; }
    .welcome-banner h2 { font-size: 1.15rem; }
    .dashboard-grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
    .dash-card { min-height: 135px; padding: 1.15rem 0.5rem 0.9rem; }
    .dash-card .icon { width: 46px; height: 46px; font-size: 1.35rem; }
    .card-title { font-size: 0.82rem; }
    .card-subtitle { font-size: 0.65rem; }
    .content-area { padding: 1.15rem; }
    .post-header { flex-direction: column; }
    .post-actions { width: 100%; }
    .post-actions button { width: 100%; }
    .quick-stats { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 400px) {
    #loginPage { padding: 1.75rem 1.25rem; }
    .dashboard-grid { gap: 0.5rem; }
    .badge { font-size: 0.5rem; padding: 0.15rem 0.4rem; }
    .quick-stats { gap: 0.5rem; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
<body>

<div class="dashboard-wrapper">

    <div id="loginPage">
        <img class="login-logo" src="https://raw.githubusercontent.com/ishrawat/imagess/refs/heads/main/logo.jpg" alt="SVGMS Logo">
        <h2>Staff Login</h2>
        <div class="login-subtitle">SVGMS Bhim Administration Portal</div>

        <form id="loginForm" onsubmit="loginUser(event)">
            <input type="email" id="loginEmail" placeholder="Email address" autocomplete="email" required>
            <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
            <button type="submit">Login</button>
        </form>

        <div id="loginMessage"></div>
    </div>

    <div id="adminPanel" style="display:none;">

        <header class="dashboard-header">
            <div class="brand">
                <img src="https://raw.githubusercontent.com/ishrawat/imagess/refs/heads/main/logo.jpg" alt="SVGMS Logo">
                <div>
                    <h1>Admin Dashboard</h1>
                    <small>Swami Vivekanand Govt. Model School, Bhim</small>
                </div>
            </div>

            <div class="user-info">
                <span class="email" id="userEmail">teacher@svgms.com</span>
                <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Website</a>
                <button class="btn-logout" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </header>

        <div class="welcome-banner">
            <h2>Welcome, Teacher</h2>
            <p>Manage school content, students, staff, and website information from one place.</p>
        </div>

        <div class="dashboard-grid">

            <button class="dash-card" onclick="location.href='admin-gallery.html'" id="card-gallery">
                <div class="icon"><i class="fas fa-images"></i></div>
                <div class="card-title">Gallery</div>
                <div class="card-subtitle">Create events &amp; upload images</div>
                <span class="badge working">Working</span>
            </button>

            <button class="dash-card" onclick="location.href='admin-notices.html'" id="card-notices">
                <div class="icon"><i class="fas fa-file-pdf"></i></div>
                <div class="card-title">Notices + PDF</div>
                <div class="card-subtitle">Upload notices with PDF</div>
                <span class="badge working">Working</span>
            </button>

            <button class="dash-card" onclick="location.href='admin-shortlist.html'" id="card-shortlist">
                <div class="icon"><i class="fas fa-list-ul"></i></div>
                <div class="card-title">Shortlist</div>
                <div class="card-subtitle">Upload admission shortlists</div>
                <span class="badge working">Working</span>
            </button>

            <button class="dash-card" onclick="location.href='admin-skills.html'" id="card-skills">
                <div class="icon"><i class="fas fa-tools"></i></div>
                <div class="card-title">Free Skills</div>
                <div class="card-subtitle">Manage skill resources</div>
                <span class="badge working">Working</span>
            </button>

            <button class="dash-card" onclick="location.href='admin-thought.html'" id="card-thought">
                <div class="icon"><i class="fas fa-quote-left"></i></div>
                <div class="card-title">Thought of the Day</div>
                <div class="card-subtitle">Update daily thought</div>
                <span class="badge working">Working</span>
            </button>

            <button class="dash-card" onclick="location.href='admin-awards.html'" id="card-awards">
                <div class="icon"><i class="fas fa-trophy"></i></div>
                <div class="card-title">Awards</div>
                <div class="card-subtitle">Manage achievements</div>
                <span class="badge working">Working</span>
            </button>

            <button class="dash-card" onclick="location.href='admin-bhamashah.html'" id="card-bhamashah">
                <div class="icon"><i class="fas fa-hand-holding-heart"></i></div>
                <div class="card-title">Bhamashah</div>
                <div class="card-subtitle">Manage donors</div>
                <span class="badge working">Working</span>
            </button>

            <button class="dash-card" onclick="location.href='admin-ticker.html'" id="card-ticker">
                <div class="icon"><i class="fas fa-newspaper"></i></div>
                <div class="card-title">Ticker</div>
                <div class="card-subtitle">Manage scrolling news</div>
                <span class="badge working">Working</span>
            </button>

            <button class="dash-card" onclick="location.href='admin-students.html'" id="card-students">
                <div class="icon"><i class="fas fa-user-graduate"></i></div>
                <div class="card-title">Student Management</div>
                <div class="card-subtitle">Manage students &amp; activity</div>
                <span class="badge working">Working</span>
            </button>

            <button class="dash-card" onclick="location.href='admin-employees.html'">
                <div class="icon"><i class="fas fa-users"></i></div>
                <div class="card-title">Employee Management</div>
                <div class="card-subtitle">Manage staff, teachers, and personnel</div>
                <span class="badge working">Working</span>
            </button>

            <button class="dash-card" onclick="location.href='admin-result.html'">
                <div class="icon"><i class="fas fa-chart-bar"></i></div>
                <div class="card-title">Result Management</div>
                <div class="card-subtitle">Manage marks, report cards, and grades</div>
                <span class="badge working">Working</span>
            </button>

        </div>

        


        <div class="quick-stats">
            <div class="stat-item"><div class="stat-number" id="statPosts">0</div><div class="stat-label"><i class="fas fa-pen"></i> Total Posts</div></div>
            <div class="stat-item"><div class="stat-number" id="statNotices">0</div><div class="stat-label"><i class="fas fa-file-alt"></i> Notices</div></div>
            <div class="stat-item"><div class="stat-number" id="statEvents">0</div><div class="stat-label"><i class="fas fa-calendar-alt"></i> Events</div></div>
            <div class="stat-item"><div class="stat-number" id="statExams">0</div><div class="stat-label"><i class="fas fa-pencil-alt"></i> Exam Updates</div></div>
            <div class="stat-item"><div class="stat-number" id="statAchievements">0</div><div class="stat-label"><i class="fas fa-trophy"></i> Achievements</div></div>
        </div>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
(function () {
    'use strict';

    /* ---------- Firebase ---------- */
    firebase.initializeApp({
        apiKey: "AIzaSyAHmBCyGlSo1puz1LZ7k-4twg_XAcOqyRA",
        authDomain: "svgms-backend.firebaseapp.com",
        projectId: "svgms-backend",
        storageBucket: "svgms-backend.firebasestorage.app",
        messagingSenderId: "1065359559935",
        appId: "1:1065359559935:web:977cea73a68e05813750ca"
    });

    var auth = firebase.auth();
    var db   = firebase.firestore();

    var loginPage  = document.getElementById('loginPage');
    var adminPanel = document.getElementById('adminPanel');
    var userEmail  = document.getElementById('userEmail');

    /* ---------- Auth state ---------- */
    auth.onAuthStateChanged(function (user) {
        if (user) {
            loginPage.style.display = 'none';
            adminPanel.style.display = 'block';
            userEmail.textContent = user.email;
            loadAdminPosts();
            updateStats();
        } else {
            loginPage.style.display = 'block';
            adminPanel.style.display = 'none';
        }
    });


        /* ---------- Idle timeout ----------
       Logs the user out after IDLE_MINUTES of inactivity.
       Activity = mouse, keyboard, scroll, touch, click.
    ------------------------------------------- */
    (function () {
        var IDLE_MINUTES = 30;
        var IDLE_MS = IDLE_MINUTES * 60 * 1000;
        var idleTimer = null;
        var warningTimer = null;
        var countdownInterval = null;

        function clearTimers() {
            if (idleTimer)        { clearTimeout(idleTimer);        idleTimer = null; }
            if (warningTimer)     { clearTimeout(warningTimer);     warningTimer = null; }
            if (countdownInterval){ clearInterval(countdownInterval); countdownInterval = null; }
        }

        function showWarning() {
            var secondsLeft = 60;
            var box = document.createElement('div');
            box.id = 'idleWarning';
            box.setAttribute('role', 'alert');
            box.style.cssText = [
                'position:fixed',
                'bottom:24px',
                'right:24px',
                'z-index:99999',
                'background:#1a2b3c',
                'color:#faf6ee',
                'padding:16px 20px',
                'border-radius:6px',
                'border-left:4px solid #c8862c',
                'box-shadow:0 12px 32px rgba(13,26,38,0.35)',
                'font-family:Manrope,system-ui,sans-serif',
                'font-size:14px',
                'max-width:340px',
                'line-height:1.5'
            ].join(';');
            box.innerHTML =
                '<div style="font-weight:700;margin-bottom:6px;">Still there?</div>' +
                '<div>You will be logged out in <strong id="idleCountdown">60</strong> seconds.</div>' +
                '<button id="idleStayBtn" style="margin-top:10px;padding:6px 14px;background:#c8862c;color:#1a2b3c;border:none;border-radius:3px;font-weight:700;font-size:12px;letter-spacing:0.04em;cursor:pointer;">Stay logged in</button>';
            document.body.appendChild(box);

            var countdownEl = box.querySelector('#idleCountdown');
            countdownInterval = setInterval(function () {
                secondsLeft--;
                if (countdownEl) countdownEl.textContent = String(Math.max(0, secondsLeft));
            }, 1000);

            box.querySelector('#idleStayBtn').addEventListener('click', function () {
                resetTimer();
            });

            /* If they don't click, the idleTimer fires and logs them out */
        }

        function removeWarning() {
            var box = document.getElementById('idleWarning');
            if (box) box.remove();
            if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
        }

        function doLogout() {
            removeWarning();
            if (auth.currentUser) {
                auth.signOut();
            }
        }

        function resetTimer() {
            clearTimers();
            removeWarning();
            if (!auth.currentUser) return;

            /* At IDLE_MINUTES - 1 minute, show the warning */
            warningTimer = setTimeout(showWarning, Math.max(0, IDLE_MS - 60000));

            /* At IDLE_MINUTES, log out */
            idleTimer = setTimeout(doLogout, IDLE_MS);
        }

        /* Every user action resets the clock */
        ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'].forEach(function (evt) {
            document.addEventListener(evt, resetTimer, { passive: true });
        });

        /* Start / stop the timer with auth state */
        auth.onAuthStateChanged(function (user) {
            if (user) {
                resetTimer();
            } else {
                clearTimers();
                removeWarning();
            }
        });
    })();


    /* ---------- Login ---------- */
    window.loginUser = async function (event) {
        event.preventDefault();

        var email = document.getElementById('loginEmail').value;
        var password = document.getElementById('loginPassword').value;
        var message = document.getElementById('loginMessage');

        message.textContent = 'Logging in…';
        message.style.color = '#666';

        try {
            var cred = await auth.signInWithEmailAndPassword(email, password);
            var user = cred.user;

            var userDoc = await db.collection('users').doc(user.uid).get();

            if (!userDoc.exists) {
                var studentDoc = await db.collection('students').doc(user.uid).get();
                if (studentDoc.exists && studentDoc.data().role === 'student') {
                    await auth.signOut();
                    message.textContent = 'Students cannot access the admin panel.';
                    message.style.color = 'red';
                    return;
                }
            }

            if (userDoc.exists) {
                var role = userDoc.data().role;
                if (role !== 'staff' && role !== 'admin') {
                    await auth.signOut();
                    message.textContent = 'Access denied. Staff or Admin only.';
                    message.style.color = 'red';
                    return;
                }
            } else {
                await auth.signOut();
                message.textContent = 'No staff account found.';
                message.style.color = 'red';
                return;
            }

            message.textContent = 'Login successful!';
            message.style.color = 'green';

        } catch (err) {
            message.textContent = err.message;
            message.style.color = 'red';
        }
    };

    /* ---------- Logout ---------- */
    window.logoutUser = function () {
        auth.signOut();
        loginPage.style.display = 'block';
        adminPanel.style.display = 'none';
        var form = document.getElementById('loginForm');
        if (form) form.reset();
        var msg = document.getElementById('loginMessage');
        if (msg) msg.textContent = '';
    };

    /* ---------- Create post ---------- */
    window.createPost = async function (event) {
        event.preventDefault();

        var title = document.getElementById('postTitle').value;
        var category = document.getElementById('postCategory').value;
        var content = document.getElementById('postContent').value;
        var message = document.getElementById('postMessage');

        message.textContent = 'Publishing…';
        message.style.color = '#666';

        try {
            var user = auth.currentUser;
            if (!user) {
                message.textContent = 'Please log in first.';
                message.style.color = 'red';
                return;
            }

            await db.collection('posts').add({
                title: title,
                category: category,
                content: content,
                author: user.email,
                date: new Date().toISOString(),
                likes: 0,
                comments: []
            });

            message.textContent = 'Post published successfully!';
            message.style.color = 'green';

            document.getElementById('postForm').reset();
            loadAdminPosts();
            updateStats();
        } catch (err) {
            message.textContent = 'Error: ' + err.message;
            message.style.color = 'red';
        }
    };

    /* ---------- Load posts ---------- */
    async function loadAdminPosts() {
        var container = document.getElementById('adminPostsList');
        if (!container) return;

        container.textContent = 'Loading posts…';

        try {
            var snapshot = await db.collection('posts').orderBy('date', 'desc').get();

            if (snapshot.empty) {
                container.innerHTML = '<p style="color:var(--text-faint);">No posts yet. Create your first post above.</p>';
                return;
            }

            container.innerHTML = '';
            snapshot.forEach(function (doc) {
                var post = doc.data();
                var card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML =
                    '<div class="post-header">' +
                        '<div>' +
                            '<span class="post-title">' + escapeHtml(post.title || '') + '</span>' +
                            '<span class="post-category">' + escapeHtml(post.category || '') + '</span>' +
                            '<div class="post-meta">' + formatDate(post.date) + ' · ' + escapeHtml(post.author || '') + '</div>' +
                            '<div class="post-content">' + escapeHtml(post.content || '') + '</div>' +
                        '</div>' +
                        '<div class="post-actions">' +
                            '<button class="btn-delete" data-post-id="' + escapeHtml(doc.id) + '">Delete</button>' +
                        '</div>' +
                    '</div>';
                container.appendChild(card);
            });

            /* Delete via delegation */
            container.addEventListener('click', function (e) {
                var btn = e.target.closest('[data-post-id]');
                if (!btn) return;
                deletePost(btn.dataset.postId);
            });
        } catch (err) {
            container.textContent = 'Error loading posts: ' + err.message;
        }
    }

    /* ---------- Delete post ---------- */
    async function deletePost(postId) {
        if (!confirm('Are you sure you want to delete this post?')) return;
        try {
            await db.collection('posts').doc(postId).delete();
            alert('Post deleted successfully!');
            loadAdminPosts();
            updateStats();
        } catch (err) {
            alert('Error deleting post: ' + err.message);
        }
    }

    /* ---------- Stats ---------- */
    async function updateStats() {
        try {
            var snapshot = await db.collection('posts').get();
            var total = 0, notices = 0, events = 0, exams = 0, achievements = 0;

            snapshot.forEach(function (doc) {
                var cat = doc.data().category;
                total++;
                if (cat === 'Notice' || cat === 'Notices') notices++;
                else if (cat === 'Event') events++;
                else if (cat === 'Exam Update') exams++;
                else if (cat === 'Achievement') achievements++;
            });

            var set = function (id, v) {
                var el = document.getElementById(id);
                if (el) el.textContent = v;
            };
            set('statPosts', total);
            set('statNotices', notices);
            set('statEvents', events);
            set('statExams', exams);
            set('statAchievements', achievements);
        } catch (err) {
            console.error('Error updating stats:', err);
        }
    }

    /* ---------- Helpers ---------- */
    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function formatDate(value) {
        if (!value) return 'Unknown date';
        var d = new Date(value);
        if (isNaN(d.getTime())) return 'Unknown date';
        return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }
})();
</script>

</body>
</html>
