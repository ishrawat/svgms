    function escapeHtml(text) {
        if (text == null) return '';
        var div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;

    /* ----------------------------------------------------------------------
       SUBJECT BADGE — two-letter colored badge for NCERT books
       ---------------------------------------------------------------------- */
    function getSubjectBadge(name) {
        var n = (name || '').toLowerCase();

        if (n.indexOf('math') !== -1)      return { text: 'MA', cls: 'maths' };
        if (n.indexOf('physics') !== -1)   return { text: 'PH', cls: 'science' };
        if (n.indexOf('chemistry') !== -1) return { text: 'CH', cls: 'science' };
        if (n.indexOf('biology') !== -1)   return { text: 'BI', cls: 'science' };
        if (n.indexOf('science') !== -1)   return { text: 'SC', cls: 'science' };
        if (n.indexOf('english') !== -1)   return { text: 'EN', cls: 'language' };
        if (n.indexOf('hindi') !== -1)     return { text: 'HI', cls: 'language' };
        if (n.indexOf('social') !== -1)    return { text: 'SS', cls: 'social' };
        if (n.indexOf('history') !== -1)   return { text: 'HI', cls: 'social' };
        if (n.indexOf('geography') !== -1) return { text: 'GE', cls: 'social' };
        if (n.indexOf('civics') !== -1)    return { text: 'CI', cls: 'social' };
        if (n.indexOf('politics') !== -1)  return { text: 'PO', cls: 'social' };
        if (n.indexOf('economics') !== -1) return { text: 'EC', cls: 'social' };

        return { text: 'BK', cls: 'other' };
    }

    /* ----------------------------------------------------------------------
       LOGO MARKUP — 3-tier fallback: Clearbit → Google favicon → letter
       ---------------------------------------------------------------------- */
    function logoMarkup(domain, name) {
        if (!domain) {
            return '<div class="resource-logo-wrap logo-failed">' +
                   escapeHtml((name || '?').charAt(0).toUpperCase()) +
                   '</div>';
        }

        var initial = (name || '?').charAt(0).toUpperCase();
        var clearbit = 'https://logo.clearbit.com/' + domain;
        var favicon = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(domain) + '&sz=128';

        return '<div class="resource-logo-wrap">' +
            '<img class="resource-logo" ' +
                 'src="' + escapeHtml(clearbit) + '" ' +
                 'alt="" ' +
                 'loading="lazy" ' +
                 'data-fallback="' + escapeHtml(favicon) + '" ' +
                 'data-initial="' + escapeHtml(initial) + '" ' +
                 'data-stage="0">' +
        '</div>';
    }

    function wireLogoFallbacks(container) {
        container.querySelectorAll('.resource-logo').forEach(function (img) {
            if (img.dataset.wired) return;
            img.dataset.wired = '1';

            img.addEventListener('error', function () {
                var stage = this.dataset.stage;

                if (stage === '0') {
                    this.dataset.stage = '1';
                    this.src = this.dataset.fallback;
                } else {
                    var wrap = this.parentNode;
                    wrap.classList.add('logo-failed');
                    wrap.textContent = this.dataset.initial;
                }
            });
        });
    }

    function loadNcertBooks() {
        var classValue = document.getElementById('classSelect').value;
        var container = document.getElementById('booksContainer');
        var books = libraryData[classValue];

        if (!books || !books.length) {
            container.innerHTML = '<div class="loading">No books available for this class.</div>';
            return;
        }

        var html = '<div class="books-grid">';
        books.forEach(function (book) {
            var badge = getSubjectBadge(book.name);
            html += '<div class="book-item">' +
                '<div class="book-info">' +
                    '<span class="subject-badge ' + badge.cls + '">' + badge.text + '</span>' +
                    '<span class="book-name">' + escapeHtml(book.name) + '</span>' +
                '</div>' +
                '<a href="' + escapeHtml(book.url) + '" target="_blank" rel="noopener" class="btn-pdf">Open PDF</a>' +
            '</div>';
        });
        html += '</div>';
        container.innerHTML = html;
    }

    function loadWorldLibraries() {
        var container = document.getElementById('worldContainer');
        var categories = {};

        worldLibraries.forEach(function (item) {
            if (!categories[item.category]) categories[item.category] = [];
            categories[item.category].push(item);
        });

        var html = '<div class="resource-grid">';
        Object.keys(categories).forEach(function (cat) {
            html += '<div class="category-heading">' + escapeHtml(cat) + '</div>';
            categories[cat].forEach(function (item) {
                html +=
                    '<article class="resource-card">' +
                        logoMarkup(item.domain, item.name) +
                        '<h3 class="resource-name">' + escapeHtml(item.name) + '</h3>' +
                        '<p class="resource-description">' + escapeHtml(item.description) + '</p>' +
                        '<a href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener" class="resource-btn">Visit</a>' +
                    '</article>';
            });
        });
        html += '</div>';
        container.innerHTML = html;

        wireLogoFallbacks(container);
    }

    /* ----------------------------------------------------------------------
       FREE SKILLS (Firebase)
       ---------------------------------------------------------------------- */
    function loadFreeSkills() {
        var container = document.getElementById('skillsContainer');
        if (!container) return;

        if (!db) {
            container.innerHTML =
                '<div class="no-resources">' +
                    '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
                    '<p>Skills load when you are online.</p>' +
                '</div>';
            return;
        }

        container.innerHTML = '<div class="loading">Loading free skills…</div>';

        db.collection('skills').orderBy('category', 'asc').get()
            .then(function (snapshot) {
                if (snapshot.empty) {
                    container.innerHTML =
                        '<div class="no-resources">' +
                            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>' +
                            '<p>No skills added yet. The admin can add skills from the dashboard.</p>' +
                        '</div>';
                    return;
                }

                var categories = {};
                snapshot.forEach(function (doc) {
                    var data = doc.data();
                    if (!categories[data.category]) categories[data.category] = [];
                    categories[data.category].push(data);
                });

                var html = '<div class="resource-grid">';
                Object.keys(categories).forEach(function (cat) {
                    html += '<div class="category-heading">' + escapeHtml(cat) + '</div>';
                    categories[cat].forEach(function (item) {
                        var platformsHtml = '';
                        if (item.platforms && item.platforms.length) {
                            var links = item.platforms.map(function (p) {
                                return '<a href="' + escapeHtml(p.url) + '" target="_blank" rel="noopener">' +
                                       escapeHtml(p.name) + '</a>';
                            }).join(' · ');
                            platformsHtml = '<div class="resource-platforms">' + links + '</div>';
                        }

                        html +=
                            '<article class="resource-card">' +
                                logoMarkup(null, item.name || '') +
                                '<h3 class="resource-name">' + escapeHtml(item.name || '') + '</h3>' +
                                '<div class="resource-category">' + escapeHtml(item.category || '') + '</div>' +
                                '<p class="resource-description">' + escapeHtml(item.description || '') + '</p>' +
                                platformsHtml +
                            '</article>';
                    });
                });
                html += '</div>';
                container.innerHTML = html;

                wireLogoFallbacks(container);
            })
            .catch(function (err) {
                console.warn('Skills unavailable:', err);
                container.innerHTML =
                    '<div class="no-resources">' +
                        '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
                        '<p>Could not load skills. Please refresh.</p>' +
                    '</div>';
            });
    }

    /* ----------------------------------------------------------------------
       TABS + INIT
       ---------------------------------------------------------------------- */
    var tabs = document.querySelectorAll('.library-tab');
    var tabContents = {
        ncert:  document.getElementById('tab-ncert'),
        world:  document.getElementById('tab-world'),
        skills: document.getElementById('tab-skills')
    };

    tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
            tabs.forEach(function (t) {
                t.classList.remove('active');
                t.setAttribute('aria-selected', 'false');
            });
            tab.classList.add('active');
            tab.setAttribute('aria-selected', 'true');

            Object.keys(tabContents).forEach(function (k) {
                tabContents[k].classList.remove('active');
            });
            tabContents[tab.dataset.tab].classList.add('active');

            if (tab.dataset.tab === 'ncert')  loadNcertBooks();
            if (tab.dataset.tab === 'world')  loadWorldLibraries();
            if (tab.dataset.tab === 'skills') loadFreeSkills();
        });
    });

    document.addEventListener('DOMContentLoaded', function () {
        var sel = document.getElementById('classSelect');
        if (sel) sel.addEventListener('change', loadNcertBooks);

        loadNcertBooks();
        loadWorldLibraries();
        loadFreeSkills();
    });
})();
</script>

</body>
</html>
