<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Shortlist of admission candidates — Swami Vivekanand Govt. Model School, Bhim.">
<title>Shortlist of Admission Candidates — SVGMS Bhim</title>
<link rel="icon" href="imgs/logo1.png" type="image/png">

<meta property="og:type" content="website">
<meta property="og:title" content="Shortlist of Admission Candidates — SVGMS Bhim">
<meta property="og:description" content="List of selected candidates for admission.">
<meta property="og:image" content="https://raw.githubusercontent.com/ishrawat/imagess/refs/heads/main/logo.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body data-nav-active="admission">

<div id="site-chrome"></div>

<section class="page-hero">
    <h1>Shortlist of Admission Candidates <small>selected candidates</small></h1>
</section>

<main class="shortlist-page">
    <div id="shortlistContainer">
        <div class="messages-loading">
            <span class="big-icon">📋</span>
            Loading shortlists…
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 Swami Vivekanand Govt. Model School, Bhim. All Rights Reserved.</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script src="site.js"></script>

<script>
(function () {
    'use strict';

    var db = (typeof firebase !== 'undefined') ? firebase.firestore() : null;
    var container = document.getElementById('shortlistContainer');
    if (!container) return;

    function escapeHtml(text) {
        if (text == null) return '';
        var div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }

    function formatDate(value) {
        try {
            return new Date(value).toLocaleDateString('en-IN', {
                day: '2-digit', month: 'short', year: 'numeric'
            });
        } catch (e) { return ''; }
    }

    function renderLoading() {
        container.innerHTML =
            '<div class="messages-loading"><span class="big-icon">📋</span>Loading shortlists…</div>';
    }

    function renderEmpty() {
        container.innerHTML =
            '<div class="messages-empty"><span class="big-icon">📋</span>' +
            'No shortlists uploaded yet. Please check back soon.</div>';
    }

    function renderError() {
        container.innerHTML =
            '<div class="messages-error"><span class="big-icon">⚠️</span>' +
            'Could not load shortlists. Please refresh.</div>';
    }

    function renderShortlists(items) {
        container.innerHTML = '';

        items.forEach(function (data) {
            var dateStr = data.date ? formatDate(data.date) : '';

            var pdfHtml = '';
            if (data.pdfUrl) {
                var href = String(data.pdfUrl);
                var withAttach = href + (href.indexOf('?') === -1 ? '?' : '&') + 'fl_attachment=true';
                pdfHtml = '<a href="' + escapeHtml(withAttach) + '" target="_blank" rel="noopener" class="pdf-btn">📥 Download PDF</a>';
            }

            var item = document.createElement('article');
            item.className = 'shortlist-item';
            item.innerHTML =
                '<div class="info">' +
                    '<div class="title">' + escapeHtml(data.title || 'Shortlist') + '</div>' +
                    (data.message ? '<div class="message">' + escapeHtml(data.message) + '</div>' : '') +
                    (dateStr ? '<div class="date">📅 Uploaded on ' + escapeHtml(dateStr) + '</div>' : '') +
                '</div>' +
                pdfHtml;

            container.appendChild(item);
        });
    }

    function loadShortlists() {
        if (!db) { renderError(); return; }
        renderLoading();

        db.collection('shortlist').orderBy('date', 'desc').get()
            .then(function (snapshot) {
                if (snapshot.empty) { renderEmpty(); return; }
                var items = [];
                snapshot.forEach(function (doc) { items.push(doc.data()); });
                renderShortlists(items);
            })
            .catch(function (err) {
                console.warn('Shortlist unavailable:', err);
                renderError();
            });
    }

    document.addEventListener('DOMContentLoaded', loadShortlists);
})();
</script>

</body>
</html>
