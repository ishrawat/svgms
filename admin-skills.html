<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Free Skills - Admin</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="icon" href="imgs/logo1.png" type="image/png" />

    
</head>
<body>

    <div class="admin-wrapper">

        <header class="admin-header">
            <h1>🎓 Manage Free Skills</h1>
            <div class="links">
                <a href="admin.html">← Dashboard</a>
                <a href="library.html">Library</a>
                <button class="btn-logout" onclick="logout()">🚪 Logout</button>
            </div>
        </header>

        <!-- Add/Edit Skill Form -->
        <div class="form-section">
            <h2 id="formTitle">➕ Add New Skill</h2>
            <div id="toast" class="toast"></div>
            <form id="skillForm" onsubmit="saveSkill(event)">
                <input type="hidden" id="editId" value="">

                <label for="skillIcon">Icon</label>
                <input type="text" id="skillIcon" placeholder="e.g., 💻, 📊, 🎨" maxlength="2">

                <label for="skillName">Skill Name *</label>
                <input type="text" id="skillName" placeholder="e.g., Python Programming" required>

                <label for="skillCategory">Category *</label>
                <select id="skillCategory" required>
                    <option value="Coding">💻 Coding</option>
                    <option value="Data Science">📊 Data Science</option>
                    <option value="Design">🎨 Design</option>
                    <option value="Digital Marketing">🌐 Digital Marketing</option>
                    <option value="Languages">🗣️ Languages</option>
                    <option value="Soft Skills">💼 Soft Skills</option>
                    <option value="Other">📌 Other</option>
                </select>

                <label for="skillDescription">Description</label>
                <textarea id="skillDescription" placeholder="Brief description of the skill..."></textarea>

                <label>Platforms (Course Providers)</label>
                <div id="platformsContainer">
                    <div class="platform-row">
                        <input type="text" class="platform-name" placeholder="Platform name (e.g., Codecademy)" style="flex:1;">
                        <input type="text" class="platform-url" placeholder="URL (e.g., https://...)" style="flex:2;">
                    </div>
                </div>
                <button type="button" class="btn-add-platform" onclick="addPlatformRow()">+ Add Platform</button>

                <div class="btn-row">
                    <button type="submit" class="btn-primary" id="saveBtn">➕ Add Skill</button>
                    <button type="button" class="btn-cancel" onclick="cancelEdit()" id="cancelBtn" style="display:none;">Cancel Edit</button>
                </div>
            </form>
        </div>

        <!-- Skills List -->
        <div class="list-section">
            <h2>📋 All Skills</h2>
            <div id="skillsList">
                <div class="empty-state">Loading skills...</div>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyAHmBCyGlSo1puz1LZ7k-4twg_XAcOqyRA",
            authDomain: "svgms-backend.firebaseapp.com",
            projectId: "svgms-backend",
            storageBucket: "svgms-backend.firebasestorage.app",
            messagingSenderId: "1065359559935",
            appId: "1:1065359559935:web:977cea73a68e05813750ca"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const skillsList = document.getElementById('skillsList');
        const toast = document.getElementById('toast');
        const saveBtn = document.getElementById('saveBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const formTitle = document.getElementById('formTitle');
        const editId = document.getElementById('editId');

        let isEditing = false;

        // ===== CHECK LOGIN =====
        auth.onAuthStateChanged(function(user) {
            if (!user) window.location.href = 'admin.html';
            else loadSkills();
        });

        // ===== ADD PLATFORM ROW =====
        function addPlatformRow(name, url) {
            const container = document.getElementById('platformsContainer');
            const row = document.createElement('div');
            row.className = 'platform-row';
            row.innerHTML = `
                <input type="text" class="platform-name" placeholder="Platform name" value="${name || ''}" style="flex:1;">
                <input type="text" class="platform-url" placeholder="URL" value="${url || ''}" style="flex:2;">
                <button type="button" class="btn-remove" onclick="removePlatformRow(this)">✕</button>
            `;
            container.appendChild(row);
        }

        function removePlatformRow(btn) {
            const row = btn.closest('.platform-row');
            if (document.querySelectorAll('.platform-row').length > 1) {
                row.remove();
            } else {
                showToast('Keep at least one platform row.', 'error');
            }
        }

        // ===== LOAD PLATFORMS FOR EDIT =====
        function loadPlatformsForEdit(platforms) {
            const container = document.getElementById('platformsContainer');
            container.innerHTML = '';
            if (platforms && platforms.length > 0) {
                platforms.forEach(p => {
                    addPlatformRow(p.name, p.url);
                });
            } else {
                addPlatformRow('', '');
            }
        }

        // ===== SAVE SKILL (Add or Update) =====
        async function saveSkill(event) {
            event.preventDefault();

            const icon = document.getElementById('skillIcon').value.trim() || '📌';
            const name = document.getElementById('skillName').value.trim();
            const category = document.getElementById('skillCategory').value;
            const description = document.getElementById('skillDescription').value.trim();
            const id = document.getElementById('editId').value;

            // Collect platforms
            const platformRows = document.querySelectorAll('.platform-row');
            const platforms = [];
            platformRows.forEach(row => {
                const nameInput = row.querySelector('.platform-name');
                const urlInput = row.querySelector('.platform-url');
                const platformName = nameInput.value.trim();
                const platformUrl = urlInput.value.trim();
                if (platformName && platformUrl) {
                    platforms.push({ name: platformName, url: platformUrl });
                }
            });

            if (!name) {
                showToast('Please enter a skill name.', 'error');
                return;
            }

            if (platforms.length === 0) {
                showToast('Please add at least one platform.', 'error');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = isEditing ? 'Updating...' : 'Adding...';
            showToast(isEditing ? 'Updating skill...' : 'Adding skill...', 'loading');

            try {
                const skillData = {
                    icon: icon,
                    name: name,
                    category: category,
                    description: description,
                    platforms: platforms,
                    isActive: true,
                    updatedAt: new Date().toISOString()
                };

                if (isEditing && id) {
                    await db.collection('skills').doc(id).update(skillData);
                    showToast('✅ Skill updated successfully!', 'success');
                } else {
                    skillData.createdAt = new Date().toISOString();
                    await db.collection('skills').add(skillData);
                    showToast('✅ Skill added successfully!', 'success');
                }

                resetForm();
                loadSkills();

            } catch (error) {
                console.error('Error:', error);
                showToast('❌ Error: ' + error.message, 'error');
            }

            saveBtn.disabled = false;
            saveBtn.textContent = isEditing ? '💾 Update Skill' : '➕ Add Skill';
        }

        // ===== EDIT SKILL =====
        async function editSkill(id) {
            try {
                const doc = await db.collection('skills').doc(id).get();
                if (!doc.exists) {
                    showToast('Skill not found.', 'error');
                    return;
                }

                const data = doc.data();
                isEditing = true;
                editId.value = id;

                // Fill form
                document.getElementById('skillIcon').value = data.icon || '📌';
                document.getElementById('skillName').value = data.name || '';
                document.getElementById('skillCategory').value = data.category || 'Other';
                document.getElementById('skillDescription').value = data.description || '';

                // Load platforms
                loadPlatformsForEdit(data.platforms || []);

                // Update UI
                formTitle.textContent = '✏️ Edit Skill';
                saveBtn.textContent = '💾 Update Skill';
                cancelBtn.style.display = 'inline-block';

                // Scroll to form
                document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                console.error('Error loading skill for edit:', error);
                showToast('❌ Error loading skill: ' + error.message, 'error');
            }
        }

        // ===== CANCEL EDIT =====
        function cancelEdit() {
            resetForm();
            showToast('Edit cancelled.', 'success');
            setTimeout(() => { toast.style.display = 'none'; }, 1000);
        }

        // ===== RESET FORM =====
        function resetForm() {
            isEditing = false;
            editId.value = '';
            document.getElementById('skillForm').reset();
            document.getElementById('platformsContainer').innerHTML = '';
            addPlatformRow('', '');
            formTitle.textContent = '➕ Add New Skill';
            saveBtn.textContent = '➕ Add Skill';
            cancelBtn.style.display = 'none';
        }

        // ===== LOAD SKILLS =====
        async function loadSkills() {
            skillsList.innerHTML = '<div class="empty-state">Loading skills...</div>';

            try {
                const snapshot = await db.collection('skills')
                    .orderBy('category', 'asc')
                    .get();

                if (snapshot.empty) {
                    skillsList.innerHTML = '<div class="empty-state">No skills added yet.</div>';
                    return;
                }

                skillsList.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;

                    const platformsHtml = data.platforms && data.platforms.length > 0
                        ? data.platforms.map(p => `${p.name}`).join(' | ')
                        : 'No platforms';

                    const item = document.createElement('div');
                    item.className = 'skill-item';
                    item.innerHTML = `
                        <div class="info">
                            <div class="name">
                                ${data.icon || '📌'} ${data.name}
                                <span style="font-size:0.7rem; color:var(--text-muted); font-weight:400; margin-left:0.5rem;">${data.category}</span>
                            </div>
                            <div class="meta">${data.description || ''}</div>
                            <div class="platforms-list">📚 ${platformsHtml}</div>
                        </div>
                        <div class="actions">
                            <button class="btn-edit" onclick="editSkill('${id}')">✏️ Edit</button>
                            <button class="btn-delete" onclick="deleteSkill('${id}')">🗑️ Delete</button>
                        </div>
                    `;
                    skillsList.appendChild(item);
                });

            } catch (error) {
                console.error('Error loading skills:', error);
                skillsList.innerHTML = '<div class="empty-state">❌ Error loading skills</div>';
            }
        }

        // ===== DELETE SKILL =====
        async function deleteSkill(id) {
            if (!confirm('Delete this skill?')) return;

            try {
                await db.collection('skills').doc(id).delete();
                showToast('🗑️ Skill deleted!', 'success');
                if (isEditing && editId.value === id) {
                    resetForm();
                }
                loadSkills();
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        // ===== TOAST =====
        function showToast(message, type) {
            toast.textContent = message;
            toast.className = 'toast ' + type;
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        // ===== LOGOUT =====
        function logout() {
            auth.signOut();
            window.location.href = 'admin.html';
        }
    </script>

</body>
</html>
