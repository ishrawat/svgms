<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Ticker - SVGMS</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="icon" href="imgs/logo1.png" type="image/png" />

  
</head>
<body>

    <div class="admin-wrapper">

        <!-- ===== HEADER ===== -->
        <header class="admin-header">
            <h1>📢 Manage Ticker</h1>
            <div class="links">
                <a href="admin.html">← Dashboard</a>
                <a href="index.html">Website</a>
                <button class="btn-logout" onclick="logout()">🚪 Logout</button>
            </div>
        </header>

        <!-- ===== ADD MESSAGE ===== -->
        <div class="add-section">
            <h2>✏️ Add New Message</h2>
            <div id="toast" class="toast"></div>
            <form id="tickerForm" onsubmit="addMessage(event)">
                <textarea id="tickerMessage" placeholder="Enter your message here... (e.g., Parent-Teacher Meeting on Dec 20)" required></textarea>
                
                <!-- PDF Upload -->
                <div class="file-input">
                    <label for="pdfFile">📎 Attach PDF (Optional)</label>
                    <input type="file" id="pdfFile" accept=".pdf">
                    <small>Upload a PDF to link with this message. Clicking the PDF link on the ticker will open it.</small>
                </div>

                <!-- Progress Bar -->
                <div id="progressContainer">
                    <div class="progress-label">
                        <span id="progressText">Uploading PDF...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-status" id="progressStatus">Preparing upload...</div>
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn-primary" id="addBtn">➕ Add Message</button>
                </div>
            </form>
        </div>

        <!-- ===== MESSAGES LIST ===== -->
        <div class="list-section">
            <h2>📋 All Messages</h2>
            <div class="subtitle">Active messages appear on the website ticker</div>
            <div id="tickerList">
                <div class="empty-state">
                    <span class="icon">📭</span>
                    <p>Loading messages...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== FIREBASE SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyAHmBCyGlSo1puz1LZ7k-4twg_XAcOqyRA",
            authDomain: "svgms-backend.firebaseapp.com",
            projectId: "svgms-backend",
            storageBucket: "svgms-backend.firebasestorage.app",
            messagingSenderId: "1065359559935",
            appId: "1:1065359559935:web:977cea73a68e05813750ca"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== CLOUDINARY CONFIG =====
        const CLOUDINARY = {
            cloudName: "zh3vg8mi",
            uploadPreset: "school_notices"
        };

        // ===== DOM REFS =====
        const tickerList = document.getElementById('tickerList');
        const toast = document.getElementById('toast');
        const addBtn = document.getElementById('addBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');
        const progressStatus = document.getElementById('progressStatus');

        // ===== CHECK LOGIN =====
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'admin.html';
            } else {
                loadMessages();
            }
        });

        // ===== UPDATE PROGRESS =====
        function updateProgress(percent, text, status) {
            progressContainer.style.display = 'block';
            progressFill.style.width = percent + '%';
            progressPercent.textContent = percent + '%';
            if (text) progressText.textContent = text;
            if (status) progressStatus.textContent = status;
        }

        function hideProgress() {
            progressContainer.style.display = 'none';
            progressFill.style.width = '0%';
            progressPercent.textContent = '0%';
        }

        // ===== ADD MESSAGE =====
        async function addMessage(event) {
            event.preventDefault();

            const message = document.getElementById('tickerMessage').value;
            const file = document.getElementById('pdfFile').files[0];
            const btn = document.getElementById('addBtn');

            if (!message.trim()) {
                showToast('Please enter a message.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Adding...';
            showToast('Adding message...', 'loading');

            try {
                let pdfUrl = null;
                let pdfName = null;

                // Upload PDF if selected
                if (file) {
                    updateProgress(0, 'Uploading PDF...', 'Preparing upload...');

                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', CLOUDINARY.uploadPreset);
                    formData.append('resource_type', 'raw');

                    // Use XMLHttpRequest for progress tracking
                    const uploadResult = await new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        
                        xhr.upload.addEventListener('progress', function(e) {
                            if (e.lengthComputable) {
                                const percent = Math.round((e.loaded / e.total) * 100);
                                updateProgress(percent, 'Uploading PDF...', `Uploaded ${percent}%`);
                            }
                        });

                        xhr.onload = function() {
                            if (xhr.status === 200) {
                                resolve(JSON.parse(xhr.responseText));
                            } else {
                                reject(new Error('Upload failed'));
                            }
                        };

                        xhr.onerror = function() {
                            reject(new Error('Network error'));
                        };

                        xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/raw/upload`);
                        xhr.send(formData);
                    });

                    if (uploadResult.secure_url) {
                        pdfUrl = uploadResult.secure_url;
                        pdfName = file.name;
                        updateProgress(100, '✅ PDF Upload Complete!', 'PDF uploaded successfully');
                        console.log('📄 PDF uploaded:', pdfUrl);
                    } else {
                        throw new Error('PDF upload failed');
                    }
                }

                const user = auth.currentUser;
                await db.collection('ticker').add({
                    message: message.trim(),
                    pdfUrl: pdfUrl,
                    pdfName: pdfName,
                    isActive: true,
                    createdAt: new Date().toISOString(),
                    createdBy: user.email || 'Admin'
                });

                showToast('✅ Message added successfully!', 'success');
                document.getElementById('tickerForm').reset();
                document.getElementById('pdfFile').value = '';
                hideProgress();
                loadMessages();

            } catch (error) {
                console.error('Error:', error);
                showToast('❌ Error: ' + error.message, 'error');
                hideProgress();
            }

            btn.disabled = false;
            btn.textContent = '➕ Add Message';
        }

        // ===== LOAD MESSAGES =====
        async function loadMessages() {
            tickerList.innerHTML = '<div class="empty-state"><span class="icon">📭</span><p>Loading messages...</p></div>';

            try {
                const snapshot = await db.collection('ticker')
                    .orderBy('createdAt', 'desc')
                    .get();

                if (snapshot.empty) {
                    tickerList.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">📭</span>
                            <p>No messages yet. Add one above!</p>
                        </div>
                    `;
                    return;
                }

                tickerList.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;

                    const item = document.createElement('div');
                    item.className = 'ticker-item';
                    if (!data.isActive) item.classList.add('inactive');

                    const date = data.createdAt ? new Date(data.createdAt) : new Date();
                    const formattedDate = date.toLocaleDateString('en-IN', {
                        day: '2-digit',
                        month: 'short',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    const pdfBadge = data.pdfUrl ? '<span class="pdf-badge">📄 PDF</span>' : '';

                    item.innerHTML = `
                        <div>
                            <div class="msg-text">
                                ${data.message}
                                ${pdfBadge}
                            </div>
                            <div class="msg-meta">
                                📅 ${formattedDate}
                                ${data.createdBy ? `| 👤 ${data.createdBy}` : ''}
                                ${data.isActive ? '🟢 Active' : '🔴 Inactive'}
                            </div>
                        </div>
                        <div class="msg-actions">
                            ${data.pdfUrl ? `<a href="${data.pdfUrl}" target="_blank" class="btn-pdf" style="padding:0.3rem 0.8rem; border:none; border-radius:4px; background:#28a745; color:white; text-decoration:none; font-size:0.85rem; cursor:pointer;">📄 PDF</a>` : ''}
                            <button class="btn-toggle" onclick="toggleMessage('${id}')">
                                ${data.isActive ? 'Hide' : 'Show'}
                            </button>
                            <button class="btn-delete" onclick="deleteMessage('${id}')">🗑️ Delete</button>
                        </div>
                    `;
                    tickerList.appendChild(item);
                });

            } catch (error) {
                console.error('Error:', error);
                tickerList.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">❌</span>
                        <p>Error loading messages. Please refresh.</p>
                    </div>
                `;
            }
        }

        // ===== DELETE MESSAGE =====
        async function deleteMessage(id) {
            if (!confirm('Delete this message?')) return;

            try {
                await db.collection('ticker').doc(id).delete();
                showToast('🗑️ Message deleted!', 'success');
                loadMessages();
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        // ===== TOGGLE MESSAGE =====
        async function toggleMessage(id) {
            try {
                const doc = await db.collection('ticker').doc(id).get();
                const currentStatus = doc.data().isActive;
                await db.collection('ticker').doc(id).update({
                    isActive: !currentStatus
                });
                showToast(`✅ Message ${!currentStatus ? 'shown' : 'hidden'}!`, 'success');
                loadMessages();
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        // ===== TOAST =====
        function showToast(message, type) {
            toast.textContent = message;
            toast.className = 'toast ' + type;

            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // ===== LOGOUT =====
        function logout() {
            auth.signOut();
            window.location.href = 'admin.html';
        }
    </script>

</body>
</html>
