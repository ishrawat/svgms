<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Notices — SVGMS Admin</title>
<link rel="icon" href="imgs/logo1.png" type="image/png">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ==========================================================================
   MANAGE NOTICES — standalone admin page
   ========================================================================== */
:root {
    --ink:            #1a2b3c;
    --ink-soft:       #2c3e50;
    --ink-deep:       #0d1a26;
    --ochre:          #c8862c;
    --ochre-bright:   #e0a347;
    --ochre-soft:     #f3e4c4;
    --terracotta:     #a84b2f;
    --sage:           #7d8f72;

    --cream:          #faf6ee;
    --cream-deep:     #f2e9d7;
    --paper:          #ffffff;

    --text:           #3a4a56;
    --text-faint:     #738290;

    --line:           rgba(26, 43, 60, 0.12);
    --line-strong:    rgba(26, 43, 60, 0.22);

    --danger:         #a02c2c;
    --danger-soft:    #fce4e4;
    --success:        #1b7f4b;
    --success-soft:   #dff5e6;

    --shadow-sm:      0 1px 2px rgba(26, 43, 60, 0.06);
    --shadow:         0 8px 28px rgba(26, 43, 60, 0.08);
    --shadow-lg:      0 22px 55px rgba(26, 43, 60, 0.14);

    --r-sm:           3px;
    --r:              5px;
    --r-lg:           10px;

    --ease:           cubic-bezier(0.4, 0, 0.2, 1);
    --t:              0.25s;

    --font-display:   'Fraunces', Georgia, serif;
    --font-ui:        'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    background:
        radial-gradient(ellipse 1000px 500px at 90% -100px, rgba(200, 134, 44, 0.08), transparent 60%),
        linear-gradient(180deg, #fafbfa, var(--cream));
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; max-width: 100%; height: auto; }

:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }

/* ---------- Layout ---------- */
.admin-wrapper {
    max-width: 1200px;
    margin: 0 auto;
    padding: clamp(1.25rem, 3vw, 2rem);
}

/* ---------- Header ---------- */
.admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1.25rem;
    flex-wrap: wrap;
    padding: 1.15rem 1.4rem;
    background: var(--paper);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    border-bottom: 3px solid var(--ochre);
    margin-bottom: 1.5rem;
}

.admin-header h1 {
    font-family: var(--font-display);
    font-variation-settings: 'SOFT' 30, 'WONK' 1;
    font-weight: 600;
    font-size: 1.35rem;
    color: var(--ink);
    letter-spacing: -0.01em;
    line-height: 1.2;
    display: flex;
    align-items: center;
    gap: 0.6rem;
}

.admin-header h1 i {
    color: var(--ochre);
    font-size: 1.1rem;
}

.admin-header .links {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.admin-header .links a {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 1rem;
    border-radius: var(--r-sm);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    border: 1px solid var(--line-strong);
    background: transparent;
    transition: all var(--t) var(--ease);
}

.admin-header .links a:hover {
    background: var(--cream);
    border-color: var(--ochre);
}

.admin-header .links a i {
    font-size: 0.75rem;
    color: var(--ochre);
}

.btn-logout {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 1rem;
    background: var(--terracotta);
    color: var(--cream);
    border: 1px solid var(--terracotta);
    border-radius: var(--r-sm);
    font-size: 0.82rem;
    font-weight: 700;
    transition: all var(--t) var(--ease);
}

.btn-logout:hover {
    background: #8b3d24;
    border-color: #8b3d24;
    transform: translateY(-1px);
}

.btn-logout i { font-size: 0.75rem; }

/* ---------- Cards ---------- */
.card {
    background: var(--paper);
    padding: clamp(1.4rem, 3vw, 2rem);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    margin-bottom: 1.5rem;
}

.card-title {
    font-family: var(--font-display);
    font-variation-settings: 'SOFT' 30, 'WONK' 1;
    font-weight: 600;
    font-size: 1.15rem;
    color: var(--ink);
    letter-spacing: -0.005em;
    margin-bottom: 1.25rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 0.55rem;
}

.card-title i {
    color: var(--ochre);
    font-size: 1rem;
}

/* Upload card gets an ochre top border */
.upload-section {
    border-top: 4px solid var(--ochre);
}

/* ---------- Form ---------- */
.form-field {
    margin-bottom: 1rem;
}

.form-field label {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 0.4rem;
}

.form-field input[type="text"],
.form-field textarea {
    width: 100%;
    padding: 0.8rem 1rem;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--cream);
    color: var(--text);
    font-size: 0.95rem;
    transition: all var(--t) var(--ease);
    font-family: inherit;
}

.form-field input[type="text"]:focus,
.form-field textarea:focus {
    outline: none;
    border-color: var(--ochre);
    background: var(--paper);
    box-shadow: 0 0 0 3px rgba(200, 134, 44, 0.14);
}

.form-field textarea {
    min-height: 90px;
    resize: vertical;
    line-height: 1.55;
}

.form-field input[type="file"] {
    width: 100%;
    padding: 0.7rem 0.9rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--cream);
    font-size: 0.88rem;
    cursor: pointer;
    transition: border-color var(--t) var(--ease), background var(--t) var(--ease);
}

.form-field input[type="file"]:hover {
    border-color: var(--ochre);
    background: var(--paper);
}

.form-field input[type="file"]::file-selector-button {
    padding: 0.4rem 0.9rem;
    margin-right: 0.75rem;
    background: var(--ink);
    color: var(--cream);
    border: none;
    border-radius: var(--r-sm);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    font-family: inherit;
    transition: background var(--t) var(--ease);
}

.form-field input[type="file"]::file-selector-button:hover {
    background: var(--ochre);
    color: var(--ink);
}

.btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.85rem 1.7rem;
    background: var(--ink);
    color: var(--cream);
    border: none;
    border-radius: var(--r-sm);
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    transition: all var(--t) var(--ease);
}

.btn-primary:hover:not(:disabled) {
    background: var(--ochre);
    color: var(--ink);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
}

.btn-primary:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

/* ---------- Message ---------- */
.message {
    display: none;
    padding: 0.85rem 1.1rem;
    border-radius: var(--r-sm);
    margin-bottom: 1.25rem;
    font-size: 0.88rem;
    font-weight: 600;
    line-height: 1.5;
    border-left: 4px solid transparent;
}

.message.success {
    display: block;
    background: var(--success-soft);
    color: var(--success);
    border-left-color: var(--success);
}

.message.error {
    display: block;
    background: var(--danger-soft);
    color: var(--danger);
    border-left-color: var(--danger);
}

.message.loading {
    display: block;
    background: var(--cream-deep);
    color: var(--text);
    border-left-color: var(--ochre);
}

/* ---------- Notice List ---------- */
.notice-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1.25rem;
    padding: 1.1rem 1.3rem;
    margin-bottom: 0.7rem;
    background: var(--cream);
    border: 1px solid var(--line);
    border-left: 4px solid var(--ochre);
    border-radius: var(--r);
    transition: all var(--t) var(--ease);
}

.notice-item:hover {
    background: var(--paper);
    box-shadow: var(--shadow-sm);
}

.notice-item:last-child { margin-bottom: 0; }

.notice-item .info {
    flex: 1;
    min-width: 0;
}

.notice-item .title {
    font-family: var(--font-display);
    font-variation-settings: 'SOFT' 30, 'WONK' 1;
    font-weight: 600;
    font-size: 1.02rem;
    color: var(--ink);
    letter-spacing: -0.005em;
    line-height: 1.3;
    margin-bottom: 0.35rem;
}

.notice-item .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.85rem;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--text-faint);
}

.notice-item .meta span {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
}

.notice-item .meta i {
    color: var(--ochre);
    font-size: 0.7rem;
}

.notice-item .description {
    margin-top: 0.55rem;
    font-size: 0.9rem;
    color: var(--text);
    line-height: 1.6;
    white-space: pre-line;
}

.notice-item .actions {
    display: flex;
    gap: 0.4rem;
    flex-shrink: 0;
    align-items: center;
}

.btn-action {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.45rem 0.85rem;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--paper);
    color: var(--ink);
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-decoration: none;
    transition: all var(--t) var(--ease);
    white-space: nowrap;
}

.btn-action i { font-size: 0.7rem; }

.btn-action.download:hover {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--cream);
}

.btn-action.delete {
    color: var(--danger);
    border-color: rgba(160, 44, 44, 0.35);
}

.btn-action.delete:hover {
    background: var(--danger);
    border-color: var(--danger);
    color: var(--cream);
}

/* ---------- States ---------- */
.empty-state {
    text-align: center;
    padding: 3rem 1.5rem;
    color: var(--text-faint);
    font-size: 0.95rem;
}

.empty-state i {
    display: block;
    font-size: 2.2rem;
    color: var(--line-strong);
    margin-bottom: 0.75rem;
}

/* ---------- Responsive ---------- */
@media (max-width: 720px) {
    .admin-header {
        flex-direction: column;
        align-items: stretch;
        text-align: left;
    }

    .admin-header .links {
        width: 100%;
        justify-content: flex-start;
    }

    .notice-item {
        flex-direction: column;
    }

    .notice-item .actions {
        width: 100%;
        justify-content: flex-start;
    }

    .btn-action {
        flex: 1;
        justify-content: center;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
<body>

<div class="admin-wrapper">

    <!-- ===== HEADER ===== -->
    <header class="admin-header">
        <h1><i class="fas fa-file-alt"></i> Manage Notices</h1>
        <div class="links">
            <a href="admin.html"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <a href="index.html"><i class="fas fa-globe"></i> Website</a>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </header>

    <!-- ===== UPLOAD ===== -->
    <section class="card upload-section">
        <h2 class="card-title"><i class="fas fa-cloud-upload-alt"></i> Upload New Notice</h2>

        <div id="uploadMessage" class="message"></div>

        <form id="uploadForm" onsubmit="uploadNotice(event)">
            <div class="form-field">
                <label for="noticeTitle">Notice Title</label>
                <input type="text" id="noticeTitle" placeholder="e.g. Half-Yearly Examination Schedule" required>
            </div>

            <div class="form-field">
                <label for="noticeDescription">Description (optional)</label>
                <textarea id="noticeDescription" placeholder="Brief description of the notice"></textarea>
            </div>

            <div class="form-field">
                <label for="pdfFile">PDF File</label>
                <input type="file" id="pdfFile" accept="application/pdf,.pdf" required>
            </div>

            <button type="submit" class="btn-primary" id="uploadBtn">
                <i class="fas fa-cloud-upload-alt"></i> Upload Notice
            </button>
        </form>
    </section>

    <!-- ===== LIST ===== -->
    <section class="card">
        <h2 class="card-title"><i class="fas fa-list"></i> All Notices</h2>

        <div id="noticesList">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                Loading notices…
            </div>
        </div>
    </section>

</div>

<!-- ===== FIREBASE SDK ===== -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
(function () {
    'use strict';

    /* ---------- Firebase ---------- */
    firebase.initializeApp({
        apiKey: "AIzaSyAHmBCyGlSo1puz1LZ7k-4twg_XAcOqyRA",
        authDomain: "svgms-backend.firebaseapp.com",
        projectId: "svgms-backend",
        storageBucket: "svgms-backend.firebasestorage.app",
        messagingSenderId: "1065359559935",
        appId: "1:1065359559935:web:977cea73a68e05813750ca"
    });

    var auth = firebase.auth();
    var db = firebase.firestore();

    /* ---------- Cloudinary ---------- */
    var CLOUDINARY = {
        cloudName: 'zh3vg8mi',
        uploadPreset: 'school_notices'
    };

    /* ---------- DOM ---------- */
    var uploadForm    = document.getElementById('uploadForm');
    var uploadBtn     = document.getElementById('uploadBtn');
    var uploadMessage = document.getElementById('uploadMessage');
    var noticesList   = document.getElementById('noticesList');

    /* ---------- Helpers ---------- */
    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function formatDate(value) {
        if (!value) return '';
        var d = new Date(value);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function showMessage(text, type) {
        uploadMessage.textContent = text;
        uploadMessage.className = 'message ' + type;
    }

    function clearMessage() {
        uploadMessage.textContent = '';
        uploadMessage.className = 'message';
    }

    /* ---------- Auth guard ---------- */
    auth.onAuthStateChanged(function (user) {
        if (!user) {
            window.location.href = 'admin.html';
            return;
        }
        loadNotices();
    });

    /* ---------- Upload ---------- */
    window.uploadNotice = async function (event) {
        event.preventDefault();

        var title = document.getElementById('noticeTitle').value.trim();
        var description = document.getElementById('noticeDescription').value.trim();
        var fileInput = document.getElementById('pdfFile');
        var file = fileInput.files[0];

        if (!title) {
            showMessage('Please enter a title.', 'error');
            return;
        }
        if (!file) {
            showMessage('Please select a PDF file.', 'error');
            return;
        }
        if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
            showMessage('Only PDF files are allowed.', 'error');
            return;
        }

        uploadBtn.disabled = true;
        uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading…';
        showMessage('Uploading to Cloudinary…', 'loading');

        try {
            var formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY.uploadPreset);

            var response = await fetch(
                'https://api.cloudinary.com/v1_1/' + CLOUDINARY.cloudName + '/auto/upload',
                { method: 'POST', body: formData }
            );

            var data = await response.json();

            if (!data.secure_url) {
                throw new Error((data.error && data.error.message) || 'Upload failed');
            }

            var user = auth.currentUser;
            await db.collection('notices').add({
                title: title,
                description: description,
                pdfUrl: data.secure_url,
                pdfName: file.name,
                author: user ? user.email : 'Admin',
                date: new Date().toISOString()
            });

            showMessage('Notice uploaded successfully.', 'success');
            uploadForm.reset();
            loadNotices();

            setTimeout(clearMessage, 5000);
        } catch (err) {
            console.error('Upload error:', err);
            showMessage('Upload failed: ' + err.message, 'error');
        }

        uploadBtn.disabled = false;
        uploadBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload Notice';
    };

    /* ---------- Load notices ---------- */
    async function loadNotices() {
        noticesList.innerHTML =
            '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i>Loading notices…</div>';

        try {
            var snapshot = await db.collection('notices').orderBy('date', 'desc').get();

            if (snapshot.empty) {
                noticesList.innerHTML =
                    '<div class="empty-state"><i class="fas fa-inbox"></i>No notices uploaded yet.</div>';
                return;
            }

            noticesList.innerHTML = '';
            snapshot.forEach(function (doc) {
                renderNotice(doc.id, doc.data());
            });
        } catch (err) {
            console.error('Error loading notices:', err);
            noticesList.innerHTML =
                '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i>Could not load notices. Please refresh.</div>';
        }
    }

    function renderNotice(id, notice) {
        var dateStr = formatDate(notice.date);
        var author = notice.author || 'Admin';

        var pdfHtml = '';
        if (notice.pdfUrl) {
            var href = String(notice.pdfUrl);
            var withAttach = href + (href.indexOf('?') === -1 ? '?' : '&') + 'fl_attachment=true';
            pdfHtml =
                '<a class="btn-action download" href="' + escapeHtml(withAttach) + '" target="_blank" rel="noopener">' +
                    '<i class="fas fa-download"></i> PDF' +
                '</a>';
        }

        var item = document.createElement('article');
        item.className = 'notice-item';
        item.innerHTML =
            '<div class="info">' +
                '<div class="title">' + escapeHtml(notice.title || 'Untitled') + '</div>' +
                '<div class="meta">' +
                    '<span><i class="fas fa-calendar"></i>' + escapeHtml(dateStr) + '</span>' +
                    '<span><i class="fas fa-user"></i>' + escapeHtml(author) + '</span>' +
                    (notice.pdfName
                        ? '<span><i class="fas fa-file-pdf"></i>' + escapeHtml(notice.pdfName) + '</span>'
                        : '') +
                '</div>' +
                (notice.description
                    ? '<div class="description">' + escapeHtml(notice.description) + '</div>'
                    : '') +
            '</div>' +
            '<div class="actions">' +
                pdfHtml +
                '<button class="btn-action delete" data-id="' + escapeHtml(id) + '">' +
                    '<i class="fas fa-trash"></i> Delete' +
                '</button>' +
            '</div>';

        noticesList.appendChild(item);
    }

    /* ---------- Delete (delegated) ---------- */
    noticesList.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-id]');
        if (!btn) return;
        deleteNotice(btn.dataset.id);
    });

    async function deleteNotice(id) {
        if (!confirm('Delete this notice? This cannot be undone.')) return;

        try {
            await db.collection('notices').doc(id).delete();
            showMessage('Notice deleted.', 'success');
            setTimeout(clearMessage, 4000);
            loadNotices();
        } catch (err) {
            showMessage('Delete failed: ' + err.message, 'error');
        }
    }

    /* ---------- Logout ---------- */
    window.logout = function () {
        auth.signOut().then(function () {
            window.location.href = 'admin.html';
        });
    };
})();
</script>

</body>
</html>
